<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kinder-Spielplatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: fröhlich, klar, für Kinder ab 5 lesbar; Elternteil ruhig und sachlich
IDEA: Spielplatz-Eingang mit Zeit-Ticket für die Woche
PICTURE: grosse Spielkacheln mit Bild aus dem Spiel, oben die Restzeit als Ring
COLOUR and TYPE: Himmelblau, Wiesengrün, kräftige Kategorie-Farben; Fredoka
LAYOUT: Startseite = Spielauswahl, Spiel im Vollbild mit Zeitanzeige; Eltern-Bereich hinter Code
*/
:root{--sky:#7cc4f0;--sky2:#b9e2fa;--grass:#55b14a;--ink:#16233a;--card:#fff;--muted:#5b6780;--red:#e4572e;--gold:#ffcc33}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:17px/1.4 Fredoka,system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--sky),var(--sky2) 60%,#d8f0c8);background-attachment:fixed;overflow-x:clip}
body::after{content:"";position:fixed;left:-10%;right:-10%;bottom:-130px;height:220px;background:var(--grass);border-radius:50%;z-index:-1}
header{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 14px) max(4vw,16px) 6px;max-width:1240px;margin:0 auto}
header h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:700;line-height:1.05;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15)}
header .sp{flex:1}
.ticket{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 16px 6px 6px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.ticket .ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--grass) calc(var(--p)*1%),#e8edf3 0);display:grid;place-items:center}
.ticket .ring span{width:34px;height:34px;border-radius:50%;background:#fff}
.ticket b{font-size:22px;line-height:1}
.ticket small{display:block;color:var(--muted);font-size:14px}
.ticket.empty .ring{background:#e8edf3}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;min-height:44px;padding:0 18px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.12)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.parents{min-height:36px;padding:0 12px;font-size:14px;background:rgba(255,255,255,.55);color:var(--muted);box-shadow:none}
main{padding:6px max(4vw,16px) 48px;max-width:1240px;margin:0 auto}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 0 6px}
.cats button{flex:none;min-height:42px;padding:0 16px;font-weight:600}
.cats button[aria-pressed=true]{background:var(--ink);color:#fff}
.note{margin:10px 0 14px;background:#fff;border-radius:18px;padding:14px 18px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px;margin-top:10px}
.game{all:unset;cursor:pointer;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;transition:transform .12s}
.game:active{transform:scale(.97)}
.game:focus-visible{outline:4px solid var(--gold)}
.game[disabled]{opacity:.45;cursor:not-allowed}
.game .art{aspect-ratio:16/10;background:var(--gc);position:relative;overflow:hidden}
.game .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.game .art.ph::after{content:attr(data-l);position:absolute;left:16px;bottom:-14px;font-size:96px;font-weight:700;color:rgba(255,255,255,.9);line-height:1}
.game .art .cat{position:absolute;left:10px;top:10px;background:var(--gc);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.game .txt{padding:10px 14px 14px}
.game b{display:block;font-size:20px;line-height:1.15}
.game small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
#player{position:fixed;inset:0;background:#000;display:none;z-index:20}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);display:flex;gap:8px;z-index:2}
#hud .time{background:rgba(22,35,58,.85);color:#fff;border-radius:999px;padding:0 14px;display:flex;align-items:center;font-weight:600;min-height:40px}
#hud .time.low{background:var(--red)}
#hud button{min-height:40px;background:rgba(255,255,255,.9)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(22,35,58,.72);display:none;place-items:center;padding:20px;z-index:40}
.overlay.show{display:grid}
.panel{background:#fff;border-radius:26px;padding:24px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.panel h3{margin:0 0 8px;font-size:28px}
.panel p{margin:0 0 14px;color:var(--muted)}
.panel input[type=password],.panel input[type=number]{font:600 20px Fredoka,sans-serif;padding:10px 14px;border:2px solid #cfd8e3;border-radius:14px;width:100%}
.panel .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
.primary{background:var(--ink);color:#fff}
.danger{background:#fde3dc;color:#a3311a}
.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e8edf3}
.stat b{font-size:20px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
label.sw{display:flex;gap:12px;align-items:center;margin:12px 0;font-weight:600}
label.sw input{width:24px;height:24px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;margin:12px 0;font-weight:600}
.log{font-size:15px;color:var(--muted);margin:6px 0 0}
.fine{font-size:13px;color:var(--muted);margin-top:14px}
@media(max-width:600px){header{flex-wrap:wrap}.ticket{order:3;width:100%}}
@media(prefers-reduced-motion:reduce){.toast,.game{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Spielplatz</h1><div class="sp"></div>
  <div class="ticket" id="ticket"><div class="ring"><span></span></div><div><b id="tMin">30 Min.</b><small id="tSub">diese Woche</small></div></div>
  <button class="parents" id="parentsBtn">Eltern</button>
</header>
<main>
  <div class="cats" id="cats"></div>
  <div class="note" id="emptyNote" hidden></div>
  <div class="games" id="games"></div>
</main>

<div id="player">
  <div id="hud"><span class="time" id="timeLeft">0:00</span><button id="stopBtn">Beenden</button></div>
</div>
<div class="toast" id="toast"></div>

<div class="overlay" id="doneOv"><div class="panel">
  <h3>Abpfiff!</h3>
  <p id="doneText">Die Spielzeit für diese Woche ist vorbei.</p>
  <div class="actions"><button class="primary" id="doneOk">OK</button></div>
</div></div>

<div class="overlay" id="codeOv"><div class="panel">
  <h3>Eltern-Bereich</h3>
  <p>Bitte den Eltern-Code eingeben.</p>
  <form id="codeForm"><input type="password" id="codeIn" autocomplete="off" aria-label="Eltern-Code"></form>
  <div class="actions"><button id="codeCancel">Abbrechen</button><button class="primary" id="codeOk">Öffnen</button></div>
</div></div>

<div class="overlay" id="parentOv"><div class="panel">
  <h3>Eltern-Bereich</h3>
  <p id="weekInfo"></p>
  <div class="stat"><span>Gespielt diese Woche</span><b id="pUsed"></b></div>
  <div class="stat"><span>Noch übrig</span><b id="pLeft"></b></div>
  <div class="log" id="pLog"></div>
  <div class="btnrow">
    <button id="bonusBtn">+10 Minuten</button>
    <button class="danger" id="resetBtn">Timer zurücksetzen</button>
  </div>
  <label class="sw"><input type="checkbox" id="unlimited"> Unbegrenzt spielen (bis ich es wieder ausschalte)</label>
  <label class="sw"><input type="checkbox" id="countLearning"> Lernspiele zählen zur Spielzeit</label>
  <label class="field">Minuten pro Woche<input type="number" id="stdMin" min="0" max="600" inputmode="numeric"></label>
  <p class="fine">Die Spielzeit wird auf diesem Gerät gespeichert. Die Woche beginnt am Samstag um 00:00 Uhr.</p>
  <div class="actions"><button class="primary" id="parentClose">Fertig</button></div>
</div></div>

<script type="module">
import * as Z from './zeitkonto.js';
{
const $ = id => document.getElementById(id);
const KEY = 'disroop.kinderspielplatz.v2';
const CAT_COLORS = {Sport:'#e4572e',Rennen:'#f39c12',Fliegen:'#2e86de',Abenteuer:'#8e44ad',Action:'#c0392b',Knobeln:'#16a085',Lernen:'#17a673'};
let state, games = [], cat = 'Alle', playing = null, lastTick = 0, warned = {}, saveT = 0, fails = 0, lockUntil = 0;

function load(){ try{ return Z.restore(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return Z.newState(); } }
function save(){ try{ Z.prune(state); localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),2600); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins = ms => Math.ceil(ms/60000);
const resetText = () => Z.nextReset(Date.now(), state.settings.resetDay, state.settings.resetHour).toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});

function renderTicket(){
  const now = Date.now(), rem = Z.remainingMs(state,now), t = $('ticket');
  if(state.unlimited){ t.style.setProperty('--p',100); t.classList.remove('empty'); $('tMin').textContent='Unbegrenzt'; $('tSub').textContent='Eltern haben freigegeben'; return; }
  const bud = Z.budgetMs(state,now);
  t.style.setProperty('--p', bud ? Math.round(rem/bud*100) : 0);
  t.classList.toggle('empty', rem<=0);
  $('tMin').textContent = rem>0 ? `${mins(rem)} Min.` : 'Fertig für diese Woche';
  $('tSub').textContent = rem>0 ? 'noch diese Woche' : `Neue Zeit ab ${resetText()}`;
}
function renderGames(){
  renderTicket();
  const cats = ['Alle', ...new Set(games.map(g=>g.category))];
  $('cats').innerHTML = cats.map(c=>`<button aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const rem = Z.remainingMs(state,Date.now());
  $('emptyNote').hidden = rem>0;
  $('emptyNote').textContent = `Diese Woche ist die Spielzeit vorbei. Ab ${resetText()} gibt es neue Zeit.${state.settings.countLearning?'':' Lernspiele gehen trotzdem.'}`;
  const list = games.filter(g => cat==='Alle' || g.category===cat);
  $('games').innerHTML = list.map(g => {
    const locked = rem<=0 && Z.counts(state,g);
    const img = g.thumb ? `<img src="${esc(g.thumbPath)}" alt="" loading="lazy">` : '';
    return `<button class="game" data-id="${g.id}" ${locked?'disabled':''} style="--gc:${CAT_COLORS[g.category]||'#555'}">
      <div class="art ${g.thumb?'':'ph'}" data-l="${esc(g.name[0])}">${img}<span class="cat">${esc(g.category)}</span></div>
      <div class="txt"><b>${esc(g.name)}</b><small>${esc(g.description)}</small></div></button>`;
  }).join('');
}

function startGame(id){
  const g = games.find(x=>x.id===id); if(!g) return;
  const counted = Z.counts(state,g);
  if(counted && Z.remainingMs(state,Date.now())<=0){ toast('Keine Spielzeit mehr diese Woche'); return; }
  playing = { game:g, counted }; warned = {};
  const f = document.createElement('iframe');
  f.src = g.path; f.allow = 'fullscreen; autoplay; gamepad'; f.title = g.name;
  $('player').appendChild(f); $('player').style.display='block';
  lastTick = Date.now(); updateHud();
  try{ document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){}
}
function stopGame(msg){
  if(!playing) return;
  tick(); save();
  $('player').querySelector('iframe')?.remove(); $('player').style.display='none';
  playing = null;
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
  if(msg){ $('doneText').textContent = msg; $('doneOv').classList.add('show'); }
  renderGames();
}
function tick(){
  if(!playing) return;
  const now = Date.now(), dt = now - lastTick; lastTick = now;
  if(!playing.counted || document.visibilityState!=='visible') return;
  const rem = Z.addUsage(state, dt, now, playing.game.id);
  if(now - saveT > 5000){ save(); saveT = now; }
  if(rem<=5*60000 && rem>60000 && !warned[5]){ warned[5]=1; toast('Noch 5 Minuten Spielzeit'); }
  if(rem<=60000 && rem>0 && !warned[1]){ warned[1]=1; toast('Noch 1 Minute! Bald ist Schluss.'); }
  if(rem<=0) stopGame(`Die Spielzeit für diese Woche ist vorbei. Neue Zeit gibt es ab ${resetText()}.`);
}
function updateHud(){
  if(!playing) return;
  const el = $('timeLeft');
  if(!playing.counted){ el.textContent='zählt nicht'; el.classList.remove('low'); return; }
  const rem = Z.remainingMs(state,Date.now());
  el.textContent = Z.formatMs(rem); el.classList.toggle('low', Number.isFinite(rem) && rem<=60000);
}
setInterval(()=>{ tick(); updateHud(); }, 1000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ lastTick=Date.now(); if(!playing){ state=load(); renderGames(); } } else { tick(); save(); } });
addEventListener('pagehide', ()=>{ tick(); save(); });

/* Eltern-Code */
async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('spielplatz:'+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function openCode(){ $('codeIn').value=''; $('codeOv').classList.add('show'); setTimeout(()=>$('codeIn').focus(),50); }
async function checkCode(e){
  e?.preventDefault();
  if(Date.now() < lockUntil){ toast(`Bitte ${Math.ceil((lockUntil-Date.now())/1000)} Sekunden warten`); return; }
  let ok = false; try{ ok = await sha($('codeIn').value.trim()) === Z.PARENT_CODE_SHA256; }catch(err){}
  if(ok){ fails=0; $('codeOv').classList.remove('show'); openParents(); }
  else { fails++; if(fails>=3){ lockUntil = Date.now()+60000; fails=0; } toast('Falscher Code'); $('codeIn').value=''; }
}
$('parentsBtn').addEventListener('click', openCode);
$('codeForm').addEventListener('submit', checkCode);
$('codeOk').addEventListener('click', checkCode);
$('codeCancel').addEventListener('click', ()=>$('codeOv').classList.remove('show'));

function openParents(){
  const now = Date.now();
  $('weekInfo').textContent = `Diese Woche läuft bis ${resetText()}, 00:00 Uhr.`;
  $('pUsed').textContent = `${Math.round(Z.usedMs(state,now)/60000)} Min.`;
  $('pLeft').textContent = state.unlimited ? 'unbegrenzt' : `${mins(Z.remainingMs(state,now))} von ${mins(Z.budgetMs(state,now))} Min.`;
  const per = {}; Z.weekLog(state,now).forEach(l => per[l.game]=(per[l.game]||0)+l.ms);
  $('pLog').textContent = Object.entries(per).sort((a,b)=>b[1]-a[1]).map(([g,ms]) => `${games.find(x=>x.id===g)?.name||g}: ${Math.max(1,Math.round(ms/60000))} Min.`).join(' · ');
  $('unlimited').checked = state.unlimited;
  $('countLearning').checked = state.settings.countLearning;
  $('stdMin').value = state.settings.weeklyMinutes;
  $('parentOv').classList.add('show');
}
$('bonusBtn').addEventListener('click', ()=>{ Z.addBonus(state,10,Date.now()); save(); openParents(); toast('10 Minuten dazu'); });
$('resetBtn').addEventListener('click', ()=>{ Z.resetWeek(state,Date.now()); save(); openParents(); toast('Timer zurückgesetzt'); });
$('unlimited').addEventListener('change', e=>{ state.unlimited = e.target.checked; save(); openParents(); });
$('countLearning').addEventListener('change', e=>{ state.settings.countLearning = e.target.checked; save(); });
$('stdMin').addEventListener('change', e=>{ state.settings.weeklyMinutes = Math.max(0, +e.target.value|0); save(); openParents(); });
$('parentClose').addEventListener('click', ()=>{ $('parentOv').classList.remove('show'); renderGames(); });

/* Navigation */
$('cats').addEventListener('click', e => { const b=e.target.closest('[data-c]'); if(b){ cat=b.dataset.c; renderGames(); } });
$('games').addEventListener('click', e => { const b=e.target.closest('.game'); if(b && !b.disabled) startGame(b.dataset.id); });
$('stopBtn').addEventListener('click', ()=>stopGame());
$('doneOk').addEventListener('click', ()=>$('doneOv').classList.remove('show'));

state = load();
renderGames();
fetch('games.json').then(r=>r.json()).then(c=>{
  games = (c.games||[]).map(g => ({...g, thumbPath: g.thumb ? g.path.replace(/[^/]+$/, g.thumb) : ''}));
  renderGames();
}).catch(()=>toast('Spieleliste nicht gefunden. Bitte über einen Webserver öffnen.'));
}
</script>
</body>
</html>
