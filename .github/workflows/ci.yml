name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.area }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [bridge, web, games, relay, android]
    steps:
      - uses: actions/checkout@v5

      # Same image as local ./project and VS Code: .devcontainer/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Devcontainer-Image bauen (gecacht)
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          tags: disroop-sensor-playground-dev
          load: true
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max

      - name: Test
        run: ./project ${{ matrix.area }} test

      - name: Build
        if: matrix.area != 'web' && matrix.area != 'games' && matrix.area != 'relay'
        run: ./project ${{ matrix.area }} build

      - uses: actions/upload-artifact@v4
        if: matrix.area != 'web' && matrix.area != 'games' && matrix.area != 'relay'
        with:
          name: ${{ matrix.area }}
          path: |
            build/thingy.exe
            build/disroop-sensor-playground-debug.apk
          if-no-files-found: error

  relay-image:
    name: relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Relay-Image bauen (Spiele + Handy-Pad + Server)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          tags: disroop-relay
          load: true
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max
      - name: Smoke
        run: |
          docker run -d --name relay -p 8080:8080 disroop-relay
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/relay | grep -q '"relay":true'
          curl -fsS http://127.0.0.1:8080/games/pad/ | grep -q 'pad'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Playground'
          docker rm -f relay

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: "{bridge,android}"
          merge-multiple: true
      - name: GitHub Release erstellen/aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/thingy.exe dist/disroop-sensor-playground-debug.apk --clobber
          else
            gh release create "$TAG" dist/thingy.exe dist/disroop-sensor-playground-debug.apk \
              --title "$TAG" --generate-notes $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi
