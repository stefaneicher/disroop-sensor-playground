name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/package-lock.json
      - run: npm ci && npm run build
        working-directory: games
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/games _site/hardware/motion-one/media
          cp console/index.html _site/
          cp -r games/dist/. _site/games/
          cp -r hardware/motion-one/media/presentation _site/hardware/motion-one/media/presentation
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
