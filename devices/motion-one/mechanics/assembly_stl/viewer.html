<!doctype html><html lang="de"><meta charset="utf-8"><title>Motion One r4 – Zusammenbau</title>
<style>
html,body{margin:0;height:100%;background:#111827;color:#e5e7eb;font:14px system-ui}
#p{position:fixed;top:10px;left:10px;background:#0009;padding:10px 12px;border-radius:8px;max-width:260px}
#p label{display:block;margin:3px 0;cursor:pointer}
#p input[type=range]{width:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
#i{margin-top:8px;font-size:12px;color:#9ca3af}
</style>
<div id="p"><b>Motion One r4</b><div id="l"></div>
<label>Transparenz <input id="a" type="range" min="0.1" max="1" step="0.05" value="0.6"></label>
<label>Schnitt (Z) <input id="c" type="range" min="-30" max="30" step="0.5" value="30"></label>
<label><input id="w" type="checkbox"> Drahtgitter</label>
<div id="i">Ziehen = drehen, Rad = zoomen, rechte Maustaste = verschieben.<br>Schnitt-Regler nach links: Gehäuse wird oben abgeschnitten.</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const parts=[['oberschale','Oberschale',0xa3e635,1],['unterschale_glatt','Unterschale',0x2aa5a1,1],['pcb_r4','Platine r4',0x22c55e,0],['tastenkappe','Tastenkappe',0xf59e0b,0],['lichtleiter','Lichtleiter',0xe5e7eb,0],['schieber','Schieber SW1',0xa3e635,0],['akku','Akku',0x3b82f6,0],['motor','Motor',0xef4444,0]];
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.localClippingEnabled=true;document.body.appendChild(r.domElement);
const s=new T.Scene();s.background=new T.Color(0x111827);
const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,1,2000);cam.up.set(0,0,1);cam.position.set(120,-220,140);
const ctl=new OrbitControls(cam,r.domElement);
s.add(new T.HemisphereLight(0xffffff,0x334155,1.2));const d=new T.DirectionalLight(0xffffff,1.5);d.position.set(100,-100,200);s.add(d);
const plane=new T.Plane(new T.Vector3(0,0,-1),30);
const meshes=[];let center=null;
for(const [f,name,col,shell] of parts){
  const id=f;const lab=document.createElement('label');
  lab.innerHTML=`<input type="checkbox" checked data-f="${id}"><span class="sw" style="background:#${col.toString(16).padStart(6,'0')}"></span>${name}`;
  document.getElementById('l').appendChild(lab);
  new STLLoader().load(f+'.stl',g=>{
    const m=new T.Mesh(g,new T.MeshStandardMaterial({color:col,transparent:true,opacity:shell?0.6:1,side:T.DoubleSide,clippingPlanes:shell?[plane]:[]}));
    m.userData={shell,f};s.add(m);meshes.push(m);
    if(f==='oberschale'){g.computeBoundingBox();center=new T.Vector3();g.boundingBox.getCenter(center);ctl.target.copy(center);cam.position.copy(center).add(new T.Vector3(120,-220,140));}
  });
}
document.getElementById('l').onchange=e=>{const m=meshes.find(x=>x.userData.f===e.target.dataset.f);if(m)m.visible=e.target.checked};
a.oninput=()=>meshes.forEach(m=>{if(m.userData.shell)m.material.opacity=+a.value});
c.oninput=()=>{plane.constant=+c.value};
w.onchange=()=>meshes.forEach(m=>m.material.wireframe=w.checked);
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
(function loop(){requestAnimationFrame(loop);ctl.update();r.render(s,cam)})();
</script></html>
