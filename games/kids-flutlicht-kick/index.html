<style>
/*
VOICE: Abendspiel unter Flutlicht, laut und fröhlich, für Kinder sofort spielbar
IDEA: TV-Übertragung eines Heimspiels in der Bergsee-Arena
PICTURE: das 3D-Stadion mit Bergen und See, Figuren mit echten Bewegungen
COLOUR and TYPE: Bergsee-Rot, Weiss, Nachtblau; Barlow Condensed wie eine Anzeigetafel

:root{--red:#d7262e;--night:#0b1530;--gold:#ffd84d}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}

#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
#score{top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);display:flex;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.45);font-weight:700;font-size:20px;line-height:1}

#score .away{background:#1f4fb5}

#score em{font-style:normal;background:#0d0d0d;color:var(--gold);padding:9px 10px;font-size:19px;min-width:64px;text-align:center;border-left:1px solid #333}
#banner{left:0;right:0;top:24%;text-align:center;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}

#bBig{font-weight:800;font-style:italic;font-size:clamp(60px,13vw,150px);line-height:.9;text-shadow:0 6px 0 var(--red),0 12px 30px rgba(0,0,0,.6)}
#bSmall{font-weight:700;font-size:clamp(20px,4vw,30px);margin-top:10px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#toast{left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);background:rgba(10,14,30,.8);padding:6px 14px;border-radius:999px;font-weight:700;font-size:18px;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}
#replayTag{left:calc(env(safe-area-inset-left) + 14px);top:calc(env(safe-area-inset-top) + 14px);background:rgba(0,0,0,.6);padding:6px 12px 6px 30px;border-radius:6px;font-weight:800;font-size:18px;letter-spacing:.04em;display:none}
#replayTag::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#ff3030;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#hint{left:50%;top:calc(env(safe-area-inset-top) + 100px);transform:translateX(-50%);background:rgba(215,38,46,.92);border:2px solid #fff;padding:5px 14px;border-radius:999px;font-weight:700;font-size:17px;white-space:nowrap;opacity:0;transition:opacity .2s}
#hint.show{opacity:1}
#power{left:50%;bottom:calc(env(safe-area-inset-bottom) + 132px);transform:translateX(-50%);width:min(240px,46vw);height:12px;border-radius:6px;background:rgba(0,0,0,.5);border:2px solid #fff;overflow:hidden;opacity:0;transition:opacity .15s}
#power.show{opacity:1}
#powerFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff8a00,var(--red))}
#radar{left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);width:176px;height:116px;border-radius:8px;background:rgba(10,30,15,.55);border:2px solid rgba(255,255,255,.55)}
#joyZone{position:fixed;left:0;bottom:0;width:45%;height:70%;z-index:4;touch-action:none;display:none}
#joyBase{position:absolute;left:calc(env(safe-area-inset-left) + 26px);bottom:calc(env(safe-area-inset-bottom) + 26px);width:146px;height:146px;border-radius:50%;background:radial-gradient(circle,rgba(11,21,48,.25) 0 44%,rgba(11,21,48,.55) 45% 100%);border:3px solid rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 0 10px rgba(215,38,46,.35)}

#joyKnob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a70,var(--red) 55%,#8f0711);border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.5)}
#btns{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 20px);display:none;gap:16px;align-items:flex-end;z-index:5}
#btns button{border:0;border-radius:50%;font:800 19px "Barlow Condensed",sans-serif;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -5px 0 rgba(0,0,0,.25);touch-action:none;display:grid;place-items:center;line-height:1}
#bA{width:80px;height:80px;background:#1f4fb5}

.panel{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:10;transition:opacity .35s;background:radial-gradient(120% 90% at 50% 100%,rgba(215,38,46,.45),rgba(11,21,48,.35) 60%,rgba(11,21,48,.7))}

.opp{display:flex;align-items:center;gap:8px}

.opp[aria-pressed=true],.chip[aria-pressed=true]{border-color:var(--gold);background:rgba(215,38,46,.85)}

.small{border-radius:999px;font-size:17px;min-height:44px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.help kbd{font:700 14px "Barlow Condensed";background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:1px 6px}
#endScore{font-weight:800;font-size:clamp(44px,9vw,76px);margin:4px 0}
#scorers{font-size:19px;margin:0 0 6px;opacity:.95}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#rotate{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:14px;opacity:.7;z-index:11;display:none;pointer-events:none}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:block}}
@media(max-width:640px){#score{font-size:16px}#score b{font-size:20px;min-width:28px;padding:8px}#score span{padding:8px 8px}#score em{font-size:15px;min-width:52px}#radar{width:132px;height:88px;bottom:calc(env(safe-area-inset-bottom) + 150px)}}
@media(prefers-reduced-motion:reduce){#banner{transition:none}}
@media(max-height:460px){h1{font-size:44px;margin:0 0 4px}.kick{font-size:15px}.lab{margin:6px 0 4px;font-size:15px}.opp,.chip{min-height:40px;padding:4px 10px;font-size:16px}.big{margin-top:10px;font-size:24px;padding:6px 36px}.help{display:none}.card .row{margin-top:6px!important}#endScore{font-size:40px}}
</style>

<body>
<canvas id="c"></canvas>
<div class="hud" id="score"><span class="home" id="sHomeName">FC Bergsee</span><b id="sH">0</b><b id="sA">0</b><span class="away" id="sAwayName">Gäste</span><em id="clock">0'</em></div>

</div></div>

</div></div>

</div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
{
/* =========================================================== Grundlagen */
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp = (v,a,b) => v<a?a:v>b?b:v, lerp = (a,b,t) => a+(b-a)*t, rnd = (a,b) => a+Math.random()*(b-a);
const HL = 34, HW = 22, GW = 2.5, GH = 2.0, GD = 1.6, BR = 0.16, HALF = 150, STEP = 1/60;
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);
const FONT = '"Barlow Condensed",sans-serif';
const store = { get(k,d){ try{ const v=localStorage.getItem('flutlicht.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('flutlicht.'+k, JSON.stringify(v)); }catch(e){} } };

const HOME = { name:'FC Bergsee', short:'BER', shirt:0xd7262e, shorts:0xffffff, socks:0xd7262e, num:'#ffffff', gk:0xffd21f, skill:1 };
const OPPS = [
  { name:'FC Gletscher', short:'GLE', shirt:0x86cdf9, shorts:0x1b3a6b, socks:0x86cdf9, num:'#0d2340', gk:0x2fb36a, skill:0.85, stars:1 },
  { name:'SC Tannenwald', short:'TAN', shirt:0x1e7a3c, shorts:0x111111, socks:0x1e7a3c, num:'#ffffff', gk:0xff8a00, skill:1.0, stars:2 },
  { name:'Blitz United', short:'BLI', shirt:0xffd400, shorts:0x111111, socks:0x111111, num:'#111111', gk:0x8e44ad, skill:1.12, stars:3 },
];
const LEVELS = {
  junior:  { label:'Junior',  aim:0.78, pass:0.85, opp:-0.15, protect:0.45, save:-0.18 },
  profi:   { label:'Profi',   aim:0.45, pass:0.55, opp:0.05,  protect:0.85, save:0.05 },
  legende: { label:'Legende', aim:0.15, pass:0.25, opp:0.1,   protect:1,    save:0.08 },
};
const HOME_SQUAD = [
  { num:1, name:'Jonas', role:'G', u:-0.95, v:0,     skin:0xffdbac, hair:0x3a2414 },
  { num:4, name:'Elias', role:'D', u:-0.62, v:-0.38, skin:0xf1c27d, hair:0xd9b060 },
  { num:5, name:'Lina',  role:'D', u:-0.62, v:0.38,  skin:0xe0ac69, hair:0x2a1a10, pony:true },
  { num:7, name:'Luca',  role:'M', u:-0.18, v:-0.62, skin:0xe0ac69, hair:0x2a1a10 },
  { num:8, name:'Mia',   role:'M', u:-0.28, v:0,     skin:0xffdbac, hair:0xc0702e, pony:true },
  { num:11,name:'Noah',  role:'M', u:-0.18, v:0.62,  skin:0x8d5524, hair:0x111111 },
  { num:10,name:'Timo',  role:'S', u:0.22,  v:0,     skin:0xffdbac, hair:0x8a5a2b, star:true },
];
const AWAY_SQUAD = HOME_SQUAD.map((p,i) => ({ ...p, name:'', num:[1,2,3,6,8,7,9][i], skin:[0xf1c27d,0xc68642,0xffdbac,0xe0ac69,0x8d5524,0xf1c27d,0xc68642][i], hair:[0x222222,0x111111,0xc9a050,0x6b4423,0x111111,0x3a2414,0x222222][i], star:false, pony:i===4 }));

/* =========================================================== Renderer */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch?1.5:2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8c7488, 150, 950);
const camera = new THREE.PerspectiveCamera(40, 1, 0.3, 3000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512,512), 0.5, 0.55, 0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let useBloom = true;
const ANISO = renderer.capabilities.getMaxAnisotropy();
function cnv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
function tex(c){ const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=ANISO; return t; }

/* =========================================================== Sound */
const SND = {
  ctx:null, master:null, crowd:null, muted: store.get('muted', false), exc:0, nextChant:12,
  init(){
    if(this.ctx) return;
    try{
      const C = this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = C.createGain(); this.master.gain.value = this.muted?0:1; this.master.connect(C.destination);
      const len = C.sampleRate*4, buf = C.createBuffer(1,len,C.sampleRate), d = buf.getChannelData(0);
      let l=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; l=(l+0.03*w)/1.03; d[i]=l*3+w*0.06; }
      this.noise = buf;
      this.crowd = C.createGain(); this.crowd.gain.value = 0.12; this.crowd.connect(this.master);
      for(const [f,q,g] of [[420,0.6,1],[1150,0.9,0.5]]){
        const s=C.createBufferSource(); s.buffer=buf; s.loop=true; s.playbackRate.value = f>1000?1.07:0.97;
        const bf=C.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=f; bf.Q.value=q;
        const gg=C.createGain(); gg.gain.value=g; s.connect(bf); bf.connect(gg); gg.connect(this.crowd); s.start();
      }
    }catch(e){ this.ctx=null; }
  },
  mute(m){ this.muted=m; store.set('muted',m); if(this.master) this.master.gain.value = m?0:1; },
  burst(dur, f, type='bandpass', gain=0.3, q=1){
    if(!this.ctx) return; const C=this.ctx, t=C.currentTime;
    const s=C.createBufferSource(); s.buffer=this.noise; const bf=C.createBiquadFilter(); bf.type=type; bf.frequency.value=f; bf.Q.value=q;
    const g=C.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(bf); bf.connect(g); g.connect(this.master); s.start(t, Math.random()*3); s.stop(t+dur+0.05);
  },
  tone(f0,f1,dur,gain,type='sine',delay=0){
    if(!this.ctx) return; const C=this.ctx, t=C.currentTime+delay;
    const o=C.createOscillator(), g=C.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  kick(p){ this.tone(160,48,0.13,0.25+0.4*p); this.burst(0.04,2500,'highpass',0.12*p+0.05); },
  net(){ this.burst(0.5,1800,'bandpass',0.25,0.7); },
  post(){ this.tone(950,930,0.6,0.25,'triangle'); this.tone(1430,1400,0.4,0.12,'sine'); },
  whistle(n=1,long=false){
    if(!this.ctx) return; const C=this.ctx;
    for(let i=0;i<n;i++){ const t=C.currentTime+i*0.42, dur=(long&&i===n-1)?0.95:0.28;
      const o=C.createOscillator(), l=C.createOscillator(), lg=C.createGain(), g=C.createGain();
      o.frequency.value=2900; l.frequency.value=38; lg.gain.value=170; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.14,t+0.02); g.gain.setValueAtTime(0.14,t+dur-0.04); g.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(g); g.connect(this.master); o.start(t); l.start(t); o.stop(t+dur+0.05); l.stop(t+dur+0.05); }
  },
  horn(){ [220,277,330].forEach(f=>this.tone(f,f,1.6,0.08,'sawtooth')); },
  roar(level){ if(!this.ctx) return; const g=this.crowd.gain, t=this.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0.12+0.85*level,t+0.3); g.exponentialRampToValueAtTime(0.12,t+4.5); },
  claps(){ if(!this.ctx) return; const pat=[0,0.6,1.2,1.5,1.8,2.1]; pat.forEach(d=>setTimeout(()=>this.burst(0.05,1600,'highpass',0.22),d*1000)); },
  update(dt, excitement){
    if(!this.ctx) return;
    this.exc = lerp(this.exc, excitement, Math.min(1,dt*1.5));
    if(this.crowd.gain.value < 0.4) this.crowd.gain.setTargetAtTime(0.1+0.22*this.exc, this.ctx.currentTime, 0.4);
    this.nextChant -= dt; if(this.nextChant<=0){ this.nextChant = rnd(16,28); this.claps(); }
  }
};

/* =========================================================== Welt: Himmel, Berge, See */
function buildSky(){
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2400,32,16), new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vP;void main(){float h=vP.y;vec3 top=vec3(.02,.05,.15);vec3 mid=vec3(.15,.18,.4);vec3 hor=vec3(1.,.56,.36);vec3 c=mix(hor,mid,smoothstep(-.02,.17,h));c=mix(c,top,smoothstep(.17,.58,h));gl_FragColor=vec4(pow(c,vec3(2.2)),1.);}' }));
  scene.add(sky);
  const n=800, pos=new Float32Array(n*3);

  for(let i=0;i<60000;i++){ x.fillStyle=Math.random()<.5?'rgba(0,30,0,.07)':'rgba(210,255,160,.045)'; x.fillRect(Math.random()*W,Math.random()*H,2,2); }

/* =========================================================== Spielzustand */
const teams=[];
let ents=[], score=[0,0], scorers=[], clock=0, half=1, kickoffFirst=0;

const input={ x:0, z:0, sprint:false, aDown:false, bDown:false, charge:0, charging:false };

function attackDir(t){ return teams[t].dir; }

function setupTeams(){

        pos:new V3(), vel:new V3(), facing:t===0?Math.PI/2:-Math.PI/2, kickCd:0, think:Math.random()*0.3, ph:Math.random()*6, amp:0, kick:0, slide:0, slideDir:new V3(), dive:0, diveDir:1, cel:0, hold:0, recover:0, runT:0, runZ:0 };

function basePos(e, kickoff){

}

/* ------------------------------------------- Bewegung */
function moveTo(e,tx,tz,speed,dt,stop=0.35){
  const dx=tx-e.pos.x, dz=tz-e.pos.z, d=Math.hypot(dx,dz); let vx=0,vz=0;
  if(d>stop){ const s=speed*Math.min(1,d/2.2); vx=dx/d*s; vz=dz/d*s; }
  const k=Math.min(1,7*dt); e.vel.x+=(vx-e.vel.x)*k; e.vel.z+=(vz-e.vel.z)*k;
}
function faceTo(e,x,z){ e.facing=Math.atan2(x-e.pos.x, z-e.pos.z); }

/* ------------------------------------------- Pass, Schuss, Grätsche */
function kickBall(e, dir, speed, vy, curve=0){
  ball.owner=null; ball.vel.set(dir.x*speed, vy, dir.z*speed); ball.pos.y=Math.max(ball.pos.y,BR+0.02); ball.curve=curve;
  ball.last=e; ball.shotId++; e.kickCd=0.32; e.kick=0.3; e.hold=0; e.facing=Math.atan2(dir.x,dir.z);
  SND.kick(Math.min(1,speed/28));
}
function laneSafety(from, to, team){
  let m=99; const ab=new V3().subVectors(to,from); const L2=ab.lengthSq()||1;
  for(const o of teams[1-team].ents){ const ap=new V3().subVectors(o.pos,from); const t=clamp(ap.dot(ab)/L2,0,1); const q=from.clone().addScaledVector(ab,t); m=Math.min(m,q.distanceTo(o.pos)); }
  return m;
}
function nearestOpp(e){ let b=null,bd=1e9; for(const o of teams[1-e.team].ents){ const d=o.pos.distanceTo(e.pos); if(d<bd){bd=d;b=o;} } return [b,bd]; }
function passOptions(e, pref){
  const d=attackDir(e.team), out=[];
  for(const m of teams[e.team].ents){
    if(m===e || m.gk) continue;
    const dist=m.pos.distanceTo(e.pos); if(dist<3.5||dist>34) continue;
    const lead=m.pos.clone().addScaledVector(m.vel, dist/18);
    const safe=laneSafety(e.pos, lead, e.team);
    let open=99; for(const o of teams[1-e.team].ents) open=Math.min(open,o.pos.distanceTo(lead));
    let s=(lead.x-e.pos.x)*d*0.35 + Math.min(open,7)*0.9 + Math.min(safe,3)*1.4 - dist*0.07;
    if(pref){ const v=new V3(lead.x-e.pos.x,0,lead.z-e.pos.z).normalize(); s += v.dot(pref)*10*(0.4+level.pass); }
    out.push({ m, lead, dist, safe, s });
  }
  return out.sort((a,b)=>b.s-a.s);
}
function passTo(e, o, lob=false){
  const dir=new V3(o.lead.x-ball.pos.x,0,o.lead.z-ball.pos.z); const d=dir.length(); dir.normalize();
  if(lob || o.safe<1.1 && d>11){ const sp=clamp(d*0.75+6,10,22); const t=d/sp; kickBall(e,dir,sp,clamp(4.9*t*1.05,3,9)); }
  else kickBall(e,dir,clamp(d*0.85+6.5,9,23),d>16?1.6:0.5);

}
function shoot(e, power, dirIn, assist){

  dir.lerp(toGoal, assist).normalize();
  const dist=Math.hypot(gx-e.pos.x, tz-e.pos.z);

function tackle(e){

  let d=(input.x||input.z)?new V3(input.x,0,input.z).normalize():fwd(e);
  const t=new V3().subVectors(ball.pos,e.pos).setY(0); if(t.length()<5){ t.normalize(); d.lerp(t,0.75).normalize(); }
  e.slide=0.45; e.slideDir.copy(d); e.facing=Math.atan2(d.x,d.z); e.tackled=false; SND.burst(0.25,500,'lowpass',0.18);

/* ------------------------------------------- KI */
function formationTarget(e){
  const d=attackDir(e.team), has=teamHas(e.team), oppHas=teamHas(1-e.team);
  const push = has?0.28:(oppHas?-0.14:0);
  let x = d*(e.base.u*HL*0.62 + push*HL) + ball.pos.x*0.5;
  let z = e.base.v*HW*0.85; z += (ball.pos.z - z)*0.28;
  if(e.role==='D') x = d>0 ? Math.min(x,10) : Math.max(x,-10);
  if(e.role==='S') x = d>0 ? Math.max(x,-6) : Math.min(x,6);
  if(e.runT>0){ x = d*Math.min(HL-6, Math.max(x*d, ball.pos.x*d+9)); z = e.runZ; }
  return { x:clamp(x,-HL+2,HL-2), z:clamp(z,-HW+1.5,HW-1.5) };
}
function markTarget(e){
  if(e.role==='S') return null;
  const ft=formationTarget(e), og=ownGoalX(e.team); let best=null, bd=10;
  for(const o of teams[1-e.team].ents){ if(o.gk||o===ball.owner) continue; const d=Math.hypot(o.pos.x-ft.x,o.pos.z-ft.z); if(d<bd){ bd=d; best=o; } }
  if(!best) return null;
  const v=new V3(og-best.pos.x,0,-best.pos.z).normalize();
  return { x:best.pos.x+v.x*1.6, z:best.pos.z+v.z*1.6 };
}
function intercept(e, speed){
  const p=new V3(), v=ball.owner?ball.owner.vel:ball.vel, s=ball.owner?ball.owner.pos:ball.pos;
  for(let t=0;t<=2.5;t+=0.1){ const f=ball.owner?t:(1-Math.exp(-1.1*t))/1.1; p.set(s.x+v.x*f, 0, s.z+v.z*f); if(p.distanceTo(e.pos)/speed<=t) return { x:p.x, z:p.z }; }

}
function teamThink(t){

  const all=T.ents.filter(e=>!e.gk).map(e=>({ e, d:e.pos.distanceTo(ball.pos) })).sort((a,b)=>a.d-b.d);
  let n = (teamHas(1-t) && ball.pos.x*attackDir(t)<0 && teamSkill(t)>=1) ? 2 : 1;
  if(human && t===0 && ctrl){ if(all[0] && all[0].e===ctrl) n-=1; }
  T.chasers = all.filter(c=>!(human && t===0 && c.e===ctrl)).slice(0,Math.max(0,n)).map(c=>c.e);
}
function aiField(e,dt){
  const sk=teamSkill(e.team), sp=(e.star?6.6:6.1)*(0.85+0.15*sk);

  let tgt;
  const chasing=teams[e.team].chasers.includes(e); if(chasing) tgt=intercept(e,sp);

  else {
    tgt=formationTarget(e);
    if(teamHas(e.team) && (e.role==='S'||e.role==='M') && e.runT<=0 && Math.random()<dt*0.25){ e.runT=rnd(1.5,2.5); e.runZ=clamp(e.pos.z+rnd(-8,8),-HW+3,HW-3); }
  }
  e.runT-=dt;
  if(restart && restart.team!==e.team){ const d=Math.hypot(tgt.x-ball.pos.x,tgt.z-ball.pos.z); if(d<5){ const k=5/(d||1); tgt={ x:ball.pos.x+(tgt.x-ball.pos.x)*k, z:ball.pos.z+(tgt.z-ball.pos.z)*k }; } }

    const d=Math.hypot(e.pos.x-ball.pos.x,e.pos.z-ball.pos.z);
    if(d<1.2){ const prot=(human&&o===ctrl)?level.protect:1; if(Math.random()<dt*2.1*sk*prot){ steal(e,o); } }
  }
}
function steal(e,o){

  else { ball.owner=null; ball.last=e; ball.vel.set(rnd(-3,3),0.4,rnd(-3,3)); e.kickCd=0.25; }
}
function aiOwner(e,dt,sk){

  e.think-=dt;
  if(e.think<=0){
    e.think=rnd(0.22,0.45)/sk;
    if(dg<21*sk && Math.abs(e.pos.z)<14 && (od<5 || dg<14) && Math.random()<0.72){
      const tz=(Math.random()<.5?-1:1)*rnd(0.4,GW-0.4), dir=new V3(gx-e.pos.x,0,tz-e.pos.z).normalize();

    }

      if((od<3.2 && Math.random()<0.75) || (fwdGain>8 && b.safe>1.5 && Math.random()<0.35)){ passTo(e,b); return; } }
  }
  let tx=gx, tz=e.pos.z*0.7;
  if(od<6){ tz += (e.pos.z-o.pos.z)/od*10; tx += (e.pos.x-o.pos.x)/od*2; }

function aiKeeper(e,dt){
  const t=e.team, d=attackDir(t), gx=ownGoalX(t), sk=teamSkill(t);

      if(human && t===0 && ctrl){ const c=opts.find(o=>o.m===ctrl); if(c && c.safe>1.5) opts=[c]; }
      if(opts.length) passTo(e,opts[0], opts[0].dist>18); else kickBall(e,new V3(d,0,rnd(-0.4,0.4)).normalize(),22,7);

  }

  moveTo(e,tx,tz,6.2,dt,0.1);

  const hd=Math.hypot(ball.pos.x-e.pos.x,ball.pos.z-e.pos.z), toward=ball.vel.x*(-d)>2;

    ball.rolled=ball.shotId; const sp=ball.vel.length(); e.dive=0.6; e.diveDir=Math.sign((ball.pos.z-e.pos.z)*d)||1;
    let p=(sp>26?0.25:sp>20?0.46:0.7)+(t===1&&human?-level.save:0)+(sk-1)*0.3; p=clamp(p,0.1,0.95);
    if(Math.random()<p){
      if(sp<20 || Math.random()<0.5){ ball.owner=e; ball.last=e; e.hold=0; toast(t===0?'Gehalten, Jonas!':'Parade!'); SND.roar(0.2); stat.saves++; }
      else { const outw=Math.random()<0.6; ball.vel.set(outw?ball.vel.x*0.25:-ball.vel.x*0.35, outw?5:4, Math.sign(ball.pos.z||1)*rnd(6,10)); ball.last=e; toast('Abgewehrt!'); SND.roar(0.3); stat.saves++; }
    } else if(ball.shooter && ball.shooter.team!==t){ excite=1; }
  } else if(hd<1.3 && ball.pos.y<1.6 && ball.vel.length()<10 && ball.last!==e && Math.abs(ball.pos.x-gx)<9){ ball.owner=e; ball.last=e; e.hold=0; }
}

/* ------------------------------------------- Mensch */
function onPickup(e){

}
function humanStep(e,dt){
  if(restart && restart.taker===e){ e.vel.set(0,0,0); if(input.x||input.z) e.facing=Math.atan2(input.x,input.z); return; }
  if(e.slide>0){ e.slide-=dt; const s=4+e.slide/0.45*8; e.vel.set(e.slideDir.x*s,0,e.slideDir.z*s);
    const o=ball.owner; if(o && o.team===1 && !o.gk && !e.tackled && Math.hypot(ball.pos.x-e.pos.x,ball.pos.z-e.pos.z)<1.5){ e.tackled=true; if(Math.random()<0.85){ steal(e,o); toast('Super Grätsche!'); SND.roar(0.3); } }
    else if(!o && !e.tackled && Math.hypot(ball.pos.x-e.pos.x,ball.pos.z-e.pos.z)<1.2 && ball.pos.y<0.8){ e.tackled=true; ball.owner=e; ball.last=e; }

function canPlayBall(e){ return ball.owner===e || (!ball.owner && Math.hypot(ball.pos.x-e.pos.x,ball.pos.z-e.pos.z)<1.7 && ball.pos.y<1.6); }
function switchPlayer(force){

function inputDir(){ return (input.x||input.z)?new V3(input.x,0,input.z).normalize():null; }
function pressA(){

/* ------------------------------------------- Standardsituationen */
function startRestart(type, team, x, z){
  restart={ type, team, t:0 };
  ball.vel.set(0,0,0); ball.curve=0; ball.shot=false; ball.shooter=null;
  const T=teams[team]; let taker;
  if(type==='goalkick') taker=keeper(team);
  else if(type==='kickoff') taker=T.ents.find(e=>e.role==='S');
  else { taker=T.ents.filter(e=>!e.gk).sort((a,b)=>Math.hypot(a.pos.x-x,a.pos.z-z)-Math.hypot(b.pos.x-x,b.pos.z-z))[0]; }
  restart.taker=taker;
  if(type==='kickoff'){ for(const e of ents){ const b=basePos(e,true); e.pos.set(b.x,0,b.z); e.vel.set(0,0,0); e.facing=teams[e.team].dir>0?Math.PI/2:-Math.PI/2; } ball.pos.set(0,BR,0); taker.pos.set(-T.dir*0.55,0,0); }
  else if(type==='throw'){ ball.pos.set(x,BR,z); taker.pos.set(x,0,z+Math.sign(z)*0.35); taker.facing = z>0?Math.PI:0; }
  else if(type==='corner'){ ball.pos.set(x-Math.sign(x)*0.3,BR,z-Math.sign(z)*0.3); taker.pos.set(x+Math.sign(x)*0.3,0,z+Math.sign(z)*0.3); faceTo(taker,0,0); }
  else if(type==='goalkick'){ ball.pos.set(x,BR,0); taker.pos.set(x-T.dir*0.6,0,0); taker.facing=T.dir>0?Math.PI/2:-Math.PI/2; }
  taker.vel.set(0,0,0); ball.owner=taker; ball.last=taker; taker.hold=0;
  if(human && team===0 && !taker.gk){ ctrl=taker; }
  const names={ throw:'Einwurf', corner:'Ecke', goalkick:'Abstoss', kickoff:'Anstoss' };
  if(type!=='kickoff') toast(names[type]+' '+(team===0?HOME.name:teams[1].kit.name)); stat[type]=(stat[type]||0)+1;
  if(human && team===0 && !taker.gk) showHint(type==='kickoff'?'Pass oder Schuss zum Anstoss':type==='throw'?'Pass = Einwurf':type==='corner'?'Pass = Flanke, Schuss = hoher Ball':'');
}
function doRestartKick(byHuman, shot, power=0.6){
  const r=restart, e=r.taker; if(!r) return; restart=null; hideHint();
  if(r.type==='throw'){
    const o=passOptions(e, byHuman?(inputDir()||fwd(e)):null).filter(o=>o.dist<20);
    const target=o[0]; e.cel=0; e.throwAnim=0.4;
    if(target){ const dir=new V3(target.lead.x-ball.pos.x,0,target.lead.z-ball.pos.z); const d=dir.length(); dir.normalize(); ball.pos.y=1.9; kickBall(e,dir,clamp(d*0.9+4,7,14),2.2); }
    else { ball.pos.y=1.9; kickBall(e,fwd(e),9,2); }
    return;
  }
  if(r.type==='corner'){
    const d=attackDir(e.team), gx=goalXOf(e.team);
    const tgt=new V3(gx-d*rnd(5,8),0,rnd(-3,3));
    const mates=teams[e.team].ents.filter(m=>!m.gk && m!==e && Math.abs(m.pos.x-gx)<12); if(mates.length){ const m=mates[(Math.random()*mates.length)|0]; tgt.set(m.pos.x,0,m.pos.z); }
    const dir=new V3(tgt.x-ball.pos.x,0,tgt.z-ball.pos.z); const dist=dir.length(); dir.normalize();
    const sp=shot?clamp(14+power*8,14,22):clamp(dist*0.8+5,12,19), t=dist/sp; kickBall(e,dir,sp,clamp(4.9*t*1.1+0.5,4,9)); return;
  }
  if(r.type==='goalkick'){ const o=passOptions(e,null); if(o.length) passTo(e,o.find(x=>x.m.role==='M')||o[0],true); else kickBall(e,new V3(attackDir(e.team),0,0),22,7); return; }
  // Anstoss
  if(byHuman && shot){ shoot(e,power,inputDir()||fwd(e),level.aim); return; }
  const o=passOptions(e, byHuman?(inputDir()||null):null).filter(x=>x.dist<15);
  if(o.length) passTo(e,o[0]); else kickBall(e,new V3(-attackDir(e.team),0,0.3).normalize(),9,0.3);
}
function updateRestart(dt){
  const r=restart; r.t+=dt;
  const humanTaker = human && r.team===0 && !r.taker.gk;
  if(r.type==='kickoff' && r.t<0.9) return;
  if(r.type==='kickoff' && !r.whistled){ r.whistled=true; SND.whistle(1); }
  if(!humanTaker && r.t>1.3) doRestartKick(false,false);
  else if(humanTaker && r.t>8) doRestartKick(false,false);
}

/* ------------------------------------------- Ball-Physik und Regeln */
function ballStep(dt){
  const b=ball;
  if(b.owner){
    const o=b.owner;
    if(o.gk){ const f=fwd(o); b.pos.set(o.pos.x+f.x*0.32,1.05,o.pos.z+f.z*0.32); b.vel.set(0,0,0); }
    else if(restart && restart.type==='throw' && restart.taker===o){ b.pos.set(o.pos.x,2.0,o.pos.z); b.vel.set(0,0,0); }
    else if(restart && restart.taker===o){ b.vel.set(0,0,0); }
    else { const f=fwd(o), sp=Math.hypot(o.vel.x,o.vel.z), dist=0.5+Math.min(0.35,sp*0.035);
      const tx=o.pos.x+f.x*dist, tz=o.pos.z+f.z*dist, k=Math.min(1,15*dt);
      b.vel.set((tx-b.pos.x)*k/dt,0,(tz-b.pos.z)*k/dt); b.pos.x+=(tx-b.pos.x)*k; b.pos.z+=(tz-b.pos.z)*k; b.pos.y=BR; }
  } else {
    b.vel.y-=9.81*dt;
    if(b.curve){ const p=new V3(-b.vel.z,0,b.vel.x).normalize(); b.vel.addScaledVector(p,b.curve*dt); b.curve*=1-1.5*dt; }
    b.pos.addScaledVector(b.vel,dt);
    if(b.pos.y<BR){ b.pos.y=BR; if(b.vel.y<-1.3){ b.vel.y*=-0.5; b.vel.x*=0.85; b.vel.z*=0.85; } else b.vel.y=0; }
    const ground=b.pos.y<BR+0.03, fr=ground?1.05:0.08; b.vel.x*=Math.max(0,1-fr*dt); b.vel.z*=Math.max(0,1-fr*dt);
    // Pfosten, Latte, Netz
    for(const sg of [-1,1]){ const gx=sg*HL;
      for(const pz of [-GW,GW]){ const dx=b.pos.x-gx, dz=b.pos.z-pz, d=Math.hypot(dx,dz);
        if(b.pos.y<GH+0.1 && d<BR+0.07 && d>0){ const nx=dx/d,nz=dz/d,vn=b.vel.x*nx+b.vel.z*nz; if(vn<0){ b.vel.x-=2*vn*nx*0.8; b.vel.z-=2*vn*nz*0.8; b.pos.x=gx+nx*(BR+0.08); b.pos.z=pz+nz*(BR+0.08); SND.post(); toast('Pfosten!'); SND.roar(0.35); } } }
      if(Math.abs(b.pos.x-gx)<BR+0.07 && Math.abs(b.pos.z)<GW && Math.abs(b.pos.y-GH)<BR+0.07 && state==='play'){ b.vel.y=-Math.abs(b.vel.y)*0.6-1; b.vel.x*=-0.45; SND.post(); toast('Latte!'); SND.roar(0.4); }
      if(Math.sign(b.pos.x)===sg && Math.abs(b.pos.x)>HL && Math.abs(b.pos.z)<GW && b.pos.y<GH && state!=='play'){
        if(Math.abs(b.pos.x)>HL+GD-BR){ b.pos.x=sg*(HL+GD-BR); if(Math.abs(b.vel.x)>3){ bulgeNet(sg,b.pos.z,b.pos.y,Math.abs(b.vel.x)); SND.net(); } b.vel.x*=-0.12; b.vel.z*=0.5; }
        if(b.pos.y>GH-BR){ b.pos.y=GH-BR; b.vel.y=-Math.abs(b.vel.y)*0.2; }
        if(Math.abs(b.pos.z)>GW-BR){ b.pos.z=Math.sign(b.pos.z)*(GW-BR); b.vel.z*=-0.3; }
      }
    }
    if(state==='play' && !restart) pickups();
  }
  const hv=Math.hypot(b.vel.x,b.vel.z); if(hv>0.05){ const ax=new V3(b.vel.z,0,-b.vel.x).normalize(); ballMesh.rotateOnWorldAxis(ax,hv*dt/BR); }
}
function pickups(){
  const b=ball; let best=null, bd=1e9;
  for(const e of ents){ if(e.gk||e.kickCd>0||e.slide>0) continue; const r=(human&&e===ctrl)?0.95:0.75; const d=Math.hypot(e.pos.x-b.pos.x,e.pos.z-b.pos.z); if(d<r && b.pos.y<1.15 && d<bd){ bd=d; best=e; } }
  if(!best) return;
  const sp=b.vel.length(), sk=teamSkill(best.team);
  if(sp<15 || Math.random()<0.45*sk){ b.owner=best; b.last=best; best.think=rnd(0.1,0.3); b.shot=false; onPickup(best); }
  else { b.vel.set(-b.vel.x*0.3+rnd(-2,2), Math.abs(b.vel.y)*0.3+0.5, -b.vel.z*0.3+rnd(-2,2)); b.last=best; best.kickCd=0.2; SND.kick(0.3); }
}
function checkOut(){
  if(state!=='play' || restart) return;
  const b=ball.pos;
  if(Math.abs(b.x)>HL+BR*0.5){
    const sg=Math.sign(b.x);
    if(Math.abs(b.z)<GW-BR*0.5 && b.y<GH-BR*0.3){ goal(sg>0?(teams[0].dir>0?0:1):(teams[0].dir>0?1:0)); return; }
    const defending = teams[0].dir*sg<0 ? 0 : 1; // Team, dessen Tor hier steht
    const lastT = ball.last ? ball.last.team : defending;
    if(lastT===defending){ startRestart('corner',1-defending,sg*HL,Math.sign(b.z||1)*HW); SND.roar(0.25); }
    else startRestart('goalkick',defending,sg*(HL-5),0);
    return;
  }
  if(Math.abs(b.z)>HW+BR*0.5){ const t=ball.last?1-ball.last.team:0; startRestart('throw',t,clamp(b.x,-HL+1,HL-1),Math.sign(b.z)*HW); }
}
function bulgeNet(sg,z,y,s){ const n=nets.find(n=>n.sg===sg); if(n){ n.t=0; n.z=z; n.y=y; n.amp=Math.min(0.6,s*0.025); } }
function updateNets(dt){
  for(const n of nets){ if(n.t>3) continue; n.t+=dt; const p=n.geo.attributes.position, a=p.array;
    for(let i=0;i<p.count;i++){ const bx=n.base[i*3], by=n.base[i*3+1]; const dz=bx-(-n.z*n.sg), dy=by-(n.y-GH/2); const f=Math.exp(-(dz*dz+dy*dy)*0.9); a[i*3+2]=n.base[i*3+2]+f*n.amp*Math.exp(-n.t*2.2)*Math.cos(n.t*14); }
    p.needsUpdate=true; }
}
function goal(team){
  score[team]++; state='goal'; stateT=0; celebTeam=team; excite=1; shake=0.5;
  const own = ball.last && ball.last.team!==team && !(ball.shooter && ball.shooter.team===team);
  const sc = ball.last && ball.last.team===team ? ball.last : (ball.shooter && ball.shooter.team===team ? ball.shooter : null);
  const min=Math.min(90,Math.max(1,Math.ceil(clock/(2*HALF)*90)));
  scorers.push({ team, name: sc?sc.name:(own?'Eigentor':'Tor'), min });
  lastGoal={ team, scorer:sc, frame:rec.count, gx:Math.sign(ball.pos.x)*HL, z:ball.pos.z };
  updateScore(); drawScreen(team===0?'TOOOR FÜR BERGSEE!':'TOR '+teams[1].kit.short);
  if(team===0){ banner('TOOOR!', sc?sc.name+' trifft für den '+HOME.name+'!':(own?'Eigentor der Gäste!':'Tor für den '+HOME.name+'!'), 3000); SND.horn(); SND.roar(1); burstConfetti(); launchFireworks(); }
  else { banner('Tor', teams[1].kit.name+' trifft', 2200); SND.roar(0.25); }

/* =========================================================== Wiederholung */
const REC_N=420, REC_F=7+14*10;
const rec={ buf:new Float32Array(REC_N*REC_F), count:0 };
function record(){
  const o=(rec.count%REC_N)*REC_F, a=rec.buf, q=ballMesh.quaternion;
  a[o]=ball.pos.x; a[o+1]=ball.pos.y; a[o+2]=ball.pos.z; a[o+3]=q.x; a[o+4]=q.y; a[o+5]=q.z; a[o+6]=q.w;
  ents.forEach((e,i)=>{ const k=o+7+i*10; a[k]=e.pos.x; a[k+1]=e.pos.z; a[k+2]=e.facing; a[k+3]=e.ph; a[k+4]=e.amp; a[k+5]=e.kick; a[k+6]=e.slide; a[k+7]=e.dive; a[k+8]=e.diveDir; a[k+9]=(ball.owner===e&&e.gk)?1:0; });
  rec.count++;
}
function applyFrame(n){
  const o=(n%REC_N)*REC_F, a=rec.buf;
  ballMesh.position.set(a[o],a[o+1],a[o+2]); ballMesh.quaternion.set(a[o+3],a[o+4],a[o+5],a[o+6]);
  ents.forEach((e,i)=>{ const k=o+7+i*10; e.pos.x=a[k]; e.pos.z=a[k+1]; e.facing=a[k+2]; e.ph=a[k+3]; e.amp=a[k+4]; e.kick=a[k+5]; e.slide=a[k+6]; e.dive=a[k+7]; e.diveDir=a[k+8]; e.gkHold=a[k+9]; e.cel=0; pose(e); });
}
let replay=null;
function startReplay(){
  const end=rec.count-1, start=Math.max(end-REC_N+5, lastGoal.frame-200);
  replay={ f:start, end, start }; state='replay'; stateT=0; $('replayTag').style.display='block';
}

/* =========================================================== Animation */
function pose(e){
  const m=e.m, amp=e.amp, ph=e.ph;
  m.root.position.set(e.pos.x,0,e.pos.z); m.root.rotation.set(0,e.facing,0);
  const L=m.legs, K=m.knees, A=m.arms, E=m.elbows;
  // Laufen
  const s=Math.sin(ph);
  L[0].rotation.set(-s*0.85*amp,0,0); L[1].rotation.set(s*0.85*amp,0,0);
  K[0].rotation.x=(0.1+Math.max(0,Math.sin(ph+1.3))*1.15)*amp; K[1].rotation.x=(0.1+Math.max(0,Math.sin(ph+1.3+Math.PI))*1.15)*amp;
  A[0].rotation.set(s*0.7*amp,0,0.08); A[1].rotation.set(-s*0.7*amp,0,-0.08);
  E[0].rotation.x=-0.25-0.6*amp; E[1].rotation.x=-0.25-0.6*amp;
  m.body.position.y=0.92+Math.abs(Math.cos(ph))*0.05*amp; m.body.rotation.set(0.13*amp,0,0);
  // Schuss
  if(e.kick>0){ const k=1-e.kick/0.3, sw=Math.sin(k*Math.PI); L[0].rotation.x=lerp(0.7,-1.5,k); K[0].rotation.x=(1-k)*1.3; A[1].rotation.z=-0.7*sw; A[0].rotation.z=0.5*sw; m.body.rotation.x=-0.1*sw; }
  // Einwurf
  if(e.throwPose){ A[0].rotation.set(-2.9,0,0.1); A[1].rotation.set(-2.9,0,-0.1); E[0].rotation.x=-0.6; E[1].rotation.x=-0.6; }
  // Grätsche
  if(e.slide>0){ m.body.rotation.x=-1.1; m.body.position.y=0.38; L[0].rotation.x=-1.45; K[0].rotation.x=0; L[1].rotation.x=-0.8; K[1].rotation.x=1.3; A[0].rotation.set(0.6,0,0.6); A[1].rotation.set(0.6,0,-0.6); }
  // Torwart
  if(e.gkHold){ A[0].rotation.set(-1.3,0,0); A[1].rotation.set(-1.3,0,0); E[0].rotation.x=-0.4; E[1].rotation.x=-0.4; }
  if(e.dive>0){ const k=Math.sin(Math.min(1,e.dive/0.6)*Math.PI); m.body.rotation.z=-e.diveDir*1.25*k; m.body.position.y=0.92-0.35*k; A[0].rotation.z=2.5*k; A[1].rotation.z=-2.5*k; }
  // Jubel
  if(e.cel>0){ const j=Math.max(0,Math.sin(stateT*9+e.idx)); m.body.position.y+=j*0.35; A[0].rotation.set(0,0,2.5); A[1].rotation.set(0,0,-2.5); E[0].rotation.x=0; E[1].rotation.x=0; }
  m.root.position.y = 0;
}
function animate(e,dt){
  const sp=Math.hypot(e.vel.x,e.vel.z);
  if(sp>0.35 && e.slide<=0 && !(ball.owner===e&&e.gk)) e.facing=angLerp(e.facing,Math.atan2(e.vel.x,e.vel.z),Math.min(1,dt*12));
  else if(sp<0.35 && !restart && ball.owner!==e && state==='play') e.facing=angLerp(e.facing,Math.atan2(ball.pos.x-e.pos.x,ball.pos.z-e.pos.z),Math.min(1,dt*4));
  e.amp=lerp(e.amp,Math.min(1,sp/7),Math.min(1,dt*8)); e.ph+=dt*(4+sp*1.5);
  e.kick=Math.max(0,e.kick-dt); e.dive=Math.max(0,e.dive-dt);
  e.gkHold = (ball.owner===e && e.gk) ? 1 : 0;
  e.throwPose = restart && restart.type==='throw' && restart.taker===e;
  pose(e);
}
function angLerp(a,b,t){ let d=b-a; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return a+d*t; }

/* =========================================================== Simulation */
const stat={ goals:0, saves:0, throw:0, corner:0, goalkick:0, kickoff:0 };
let thinkT=0;
function simulate(dt){
  stateT+=dt;
  if(state==='play'){
    clock+=dt;
    if(clock>=HALF && half===1){ halfTime(); return; }
    if(clock>=2*HALF){ endMatch(); return; }
  }
  if(state==='goal'){
    if(stateT>2.8){ if(human) startReplay(); else { celebTeam=-1; state='play'; startRestart('kickoff',1-lastGoal.team); } }
  }
  if(state==='half' && stateT>3){ state='play'; half=2; startRestart('kickoff',1-kickoffFirst); banner('2. Halbzeit','',1400); }
  const active = state==='play' || state==='goal';
  if(!active) return;
  thinkT-=dt; if(thinkT<=0){ thinkT=0.2; teamThink(0); teamThink(1); if(human && state==='play' && !restart && !teamHas(0) && ctrl && !(ctrl.switchT>0)) switchPlayer(false); }
  if(restart && state==='play') updateRestart(dt);
  for(const e of ents){
    e.kickCd=Math.max(0,e.kickCd-dt); if(e.switchT>0) e.switchT-=dt;
    if(state==='goal'){
      if(e.team===celebTeam && !e.gk){ const sc=lastGoal.scorer||e; const cz=lastGoal.cornerZ||HW; const tx=e===sc?lastGoal.gx*0.92:sc.pos.x-attackDir(e.team)*2, tz=e===sc?cz*0.9:sc.pos.z+(e.idx-3)*1.2; moveTo(e,tx,tz,e===sc?7.5:6.5,dt,0.6); e.cel = Math.hypot(tx-e.pos.x,tz-e.pos.z)<2.5?1:0; }
      else { const b=basePos(e,false); moveTo(e,b.x,b.z,2.5,dt); e.cel=0; }
    } else if(e.gk) aiKeeper(e,dt);
    else if(human && e===ctrl) humanStep(e,dt);
    else if(e.slide>0){ e.slide-=dt; e.vel.multiplyScalar(0.95); }
    else if(e.recover>0){ e.recover-=dt; e.vel.multiplyScalar(Math.max(0,1-6*dt)); }
    else aiField(e,dt);
    e.pos.x=clamp(e.pos.x+e.vel.x*dt,-HL-3,HL+3); e.pos.z=clamp(e.pos.z+e.vel.z*dt,-HW-2.2,HW+2.2);
  }
  for(let i=0;i<ents.length;i++) for(let j=i+1;j<ents.length;j++){ const a=ents[i],b=ents[j]; const dx=b.pos.x-a.pos.x,dz=b.pos.z-a.pos.z,d=Math.hypot(dx,dz); if(d<0.7&&d>1e-4){ const p=(0.7-d)/2; a.pos.x-=dx/d*p; a.pos.z-=dz/d*p; b.pos.x+=dx/d*p; b.pos.z+=dz/d*p; } }
  if(restart && restart.taker){ const t=restart.taker; t.vel.set(0,0,0); }
  ballStep(dt);
  checkOut();
  if(input.charging){ input.charge=Math.min(1,input.charge+dt/0.85); }
  if(state==='play' || (state==='goal' && stateT<1.2)) record();
  const bx=ball.pos.x; excite=Math.max(excite-dt*0.25, Math.max(0,(Math.abs(bx)-HL+20)/20)*0.6);
}

/* =========================================================== Ablauf */
function updateScore(){ $('sH').textContent=score[0]; $('sA').textContent=score[1]; }
function newMatch(isHuman){
  human=isHuman; score=[0,0]; scorers=[]; clock=0; half=1; kickoffFirst=Math.random()<.5?0:1; restart=null; ctrl=null; celebTeam=-1;
  setupTeams(); updateScore(); drawScreen();
  for(const e of ents){ const b=basePos(e,true); e.pos.set(b.x,0,b.z); e.vel.set(0,0,0); }
  ball.owner=null; ball.pos.set(0,BR,0); ball.vel.set(0,0,0); rec.count=0;
  for(const c of confetti.parts){ c.life=0; c.p.y=-50; }
}
function startGame(){
  SND.init(); if(SND.ctx && SND.ctx.state==='suspended') SND.ctx.resume();
  levelKey=store.get('level','junior'); level=LEVELS[levelKey];
  newMatch(true);
  $('menu').classList.add('hidden'); $('endPanel').classList.add('hidden');
  ['joyZone'].forEach(id=>$(id).style.display='block'); $('btns').style.display='flex'; $('pauseBtn').style.display='block';
  state='intro'; stateT=0; for(const e of ents) e.cel=0;
  banner(HOME.name, 'gegen '+teams[1].kit.name, 3200); SND.roar(0.6);
}
function finishIntro(){ state='play'; stateT=0; startRestart('kickoff',kickoffFirst); banner('Anpfiff!','',1200); ctrl=teams[0].ents.find(e=>e.role==='S'); }
function halfTime(){ state='half'; stateT=0; SND.whistle(2,true); banner('Halbzeit', HOME.name+' '+score[0]+' : '+score[1]+' '+teams[1].kit.name, 2800); restart=null; }
function endMatch(){
  state='end'; stateT=0; SND.whistle(3,true); restart=null;
  if(!human){ newMatch(false); state='play'; startRestart('kickoff',0); return; }
  const r=score[0]>score[1]?'Sieg für den FC Bergsee!':score[0]===score[1]?'Unentschieden.':'Knapp verloren, nächstes Mal klappt es.';
  if(score[0]>score[1]){ burstConfetti(); launchFireworks(); SND.roar(0.9); celebTeam=0; }
  $('endScore').textContent=`${HOME.name} ${score[0]} : ${score[1]} ${teams[1].kit.name}`;
  $('scorers').textContent = scorers.length ? scorers.map(s=>`${s.min}' ${s.name}${s.team===1&&s.name!=='Eigentor'?' ('+teams[1].kit.short+')':''}`).join(' · ') : 'Keine Tore';
  $('endText').textContent=r;
  setTimeout(()=>{ $('endPanel').classList.remove('hidden'); hideControls(); },1800);
}
function hideControls(){ $('joyZone').style.display='none'; $('btns').style.display='none'; $('pauseBtn').style.display='none'; }
function toMenu(){ $('pausePanel').classList.add('hidden'); $('endPanel').classList.add('hidden'); $('menu').classList.remove('hidden'); hideControls(); paused=false; startDemo(); }
function startDemo(){ newMatch(false); state='play'; startRestart('kickoff',0); }

/* =========================================================== Kamera */
const camPos=new V3(0,20,40), camLook=new V3();
function updateCamera(dt){
  const portrait=camera.aspect<1; let tp, tl, k=1-Math.exp(-3*dt);
  if(state==='intro'){ const a=-0.6+stateT*0.32, r=lerp(62,40,Math.min(1,stateT/4)); tp=new V3(Math.sin(a)*r, lerp(26,15,Math.min(1,stateT/4)), Math.cos(a)*r); tl=new V3(0,1,0); k=1; }
  else if(state==='replay' && lastGoal){ const sg=Math.sign(lastGoal.gx)||1; tp=new V3(lastGoal.gx+sg*6, 3.4, lastGoal.z>0?-9:9); tl=ballMesh.position.clone(); k=1-Math.exp(-6*dt); }
  else if(state==='goal' && lastGoal && lastGoal.scorer){ const s=lastGoal.scorer.pos; tp=new V3(s.x*0.85, 7, s.z*0.5+15); tl=new V3(s.x,1,s.z); k=1-Math.exp(-2.5*dt); }
  else { const f=ball.pos, lead=ball.owner?ball.owner.vel:ball.vel; const fx=clamp(f.x+lead.x*0.25,-HL+6,HL-6);
    tp=new V3(fx*0.9, portrait?21:13.5, f.z*0.4+(portrait?31:23.5)); tl=new V3(fx,0.5,f.z*0.62-2.5); }
  camPos.lerp(tp,k); camLook.lerp(tl,k);
  camera.position.copy(camPos); if(shake>0){ shake-=dt; camera.position.x+=rnd(-1,1)*shake*0.4; camera.position.y+=rnd(-1,1)*shake*0.3; }
  camera.lookAt(camLook);
}

/* =========================================================== HUD */
function toast(t){ if(!human) return; const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),1400); }
function banner(big,small,ms=2400){ if(!human) return; $('bBig').textContent=big; $('bSmall').textContent=small||''; $('banner').classList.add('show'); clearTimeout(banner.h); banner.h=setTimeout(()=>$('banner').classList.remove('show'),ms); }
function showHint(t){ if(!t) return hideHint(); $('hint').textContent=t; $('hint').classList.add('show'); }
function hideHint(){ $('hint').classList.remove('show'); }
const radar=$('radar').getContext('2d');
function drawRadar(){
  const W=352,H=232,sx=W/(2*HL+4),sz=H/(2*HW+4), X=x=>(x+HL+2)*sx, Z=z=>(z+HW+2)*sz;
  radar.clearRect(0,0,W,H); radar.strokeStyle='rgba(255,255,255,.6)'; radar.lineWidth=2;
  radar.strokeRect(X(-HL),Z(-HW),2*HL*sx,2*HW*sz); radar.beginPath(); radar.moveTo(X(0),Z(-HW)); radar.lineTo(X(0),Z(HW)); radar.stroke();
  radar.beginPath(); radar.arc(X(0),Z(0),6*sx,0,7); radar.stroke();
  for(const e of ents){ radar.fillStyle = e.team===0?'#ff4b4b':'#'+new THREE.Color(teams[1].kit.shirt).getHexString(); radar.beginPath(); radar.arc(X(e.pos.x),Z(e.pos.z),e===ctrl&&human?9:6,0,7); radar.fill(); if(e===ctrl&&human){ radar.strokeStyle='#ffd84d'; radar.lineWidth=3; radar.stroke(); } }
  radar.fillStyle='#fff'; radar.beginPath(); radar.arc(X(ball.pos.x),Z(ball.pos.z),5,0,7); radar.fill();
}
let lastLabels='';
function updateHud(){
  const min=Math.min(90,Math.floor(clock/(2*HALF)*90));
  $('clock').textContent = human ? `${min}'` : 'Demo';
  if(human && ctrl && state==='play'){
    const with_=canPlayBall(ctrl) || (restart&&restart.team===0&&restart.taker===ctrl);
    const la=with_?'Pass':'Grätsche', lb=with_?'Schuss':'Wechsel', key=la+lb;
    if(key!==lastLabels){ lastLabels=key; $('bA').textContent=la; $('bB').textContent=lb; $('bA').classList.toggle('alt',!with_); $('bB').classList.toggle('alt',!with_); }
    if(input.charging) $('powerFill').style.width=(input.charge*100)+'%';
  }
}
const ring=new THREE.Mesh(new THREE.RingGeometry(0.55,0.72,36), new THREE.MeshBasicMaterial({ color:new THREE.Color(2,1.7,0.4), transparent:true, opacity:0.9 })); ring.rotation.x=-Math.PI/2;
const arrow=(()=>{ const sh=new THREE.Shape(); sh.moveTo(0,0.55); sh.lineTo(0.38,0); sh.lineTo(0.13,0); sh.lineTo(0.13,-0.4); sh.lineTo(-0.13,-0.4); sh.lineTo(-0.13,0); sh.lineTo(-0.38,0); sh.closePath(); const g=new THREE.ShapeGeometry(sh); g.rotateX(-Math.PI/2); g.scale(1.4,1,-1.4); return new THREE.Mesh(g,new THREE.MeshBasicMaterial({ color:new THREE.Color(2,1.7,0.4), side:THREE.DoubleSide })); })();
const oppRing=new THREE.Mesh(new THREE.RingGeometry(0.6,0.8,36), new THREE.MeshBasicMaterial({ color:new THREE.Color(2.2,0.3,0.3), transparent:true, opacity:0.9 })); oppRing.rotation.x=-Math.PI/2;
let label;
function buildMarkers(){
  scene.add(ring,arrow,oppRing);
  const [c,x]=cnv(256,72); label=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex(c), depthTest:false, transparent:true, fog:false })); label.scale.set(2.2,0.62,1); label.renderOrder=999; label.userData={c,x,name:''}; scene.add(label);
}
function drawLabel(name){
  const {c,x}=label.userData; if(label.userData.name===name) return; label.userData.name=name;
  x.clearRect(0,0,256,72); x.fillStyle='rgba(215,38,46,.95)'; x.beginPath(); x.roundRect(4,4,248,50,14); x.fill(); x.beginPath(); x.moveTo(116,54); x.lineTo(128,70); x.lineTo(140,54); x.fill();
  x.fillStyle='#fff'; x.font='800 34px '+FONT; x.textAlign='center'; x.textBaseline='middle'; x.fillText(name.toUpperCase(),128,30); label.material.map.needsUpdate=true;
}
function updateMarkers(t){
  const show = human && ctrl && (state==='play');
  ring.visible=label.visible=!!show; arrow.visible=false; oppRing.visible=false;
  if(!show) return;
  ring.position.set(ctrl.pos.x,0.03,ctrl.pos.z); ring.material.opacity=0.65+0.3*Math.sin(t*6);
  label.position.set(ctrl.pos.x,2.45,ctrl.pos.z); drawLabel(ctrl.name+' '+ctrl.num);
  const o=ball.owner;
  if(o && o.team===1 && !o.gk){ oppRing.visible=true; oppRing.position.set(o.pos.x,0.04,o.pos.z); const s=1+0.15*Math.sin(t*8); oppRing.scale.set(s,s,s); }
  if(!canPlayBall(ctrl) && !teamHas(0)){ const v=new V3(ball.pos.x-ctrl.pos.x,0,ball.pos.z-ctrl.pos.z); if(v.length()>1.8){ v.normalize(); arrow.visible=true; arrow.position.set(ctrl.pos.x+v.x*1.5,0.05,ctrl.pos.z+v.z*1.5); arrow.rotation.set(0,Math.atan2(v.x,v.z),0); } }
  const showOppHint = o && o.team===1 && !o.gk && !restart;
  if(showOppHint) showHint('Ball holen: hinlaufen und GRÄTSCHE'); else if(!restart) hideHint();
}
function updateCrowd(t){
  const m=new THREE.Matrix4(), half=frameN&1;
  for(let i=half;i<crowd.length;i+=2){ const c=crowd[i]; const team=c.away?1:0; const ex=(team===celebTeam?1:0)*Math.max(0,1-stateT/6)+excite*0.25+0.05;
    const j=Math.max(0,Math.sin(t*(5+c.sp)+c.ph))*ex*0.5; m.makeTranslation(c.x,c.y+j,c.z); cBody.setMatrixAt(i,m); m.makeTranslation(c.x,c.y+0.45+j,c.z); cHead.setMatrixAt(i,m); }
  cBody.instanceMatrix.needsUpdate=true; cHead.instanceMatrix.needsUpdate=true;
  for(const f of flags){ const p=f.mesh.geometry.attributes.position, a=p.array; for(let i=0;i<p.count;i++){ const x=f.base[i*3]; a[i*3+2]=Math.sin(t*5+f.ph+x*2.6)*0.18*x/1.5; a[i*3+1]=f.base[i*3+1]-x*0.05; } p.needsUpdate=true; }
}

/* =========================================================== Eingabe */
const keys={};
function keyInput(){ if(joy.id!==null) return; let x=0,z=0; if(keys.KeyA||keys.ArrowLeft)x--; if(keys.KeyD||keys.ArrowRight)x++; if(keys.KeyW||keys.ArrowUp)z--; if(keys.KeyS||keys.ArrowDown)z++; const l=Math.hypot(x,z)||1; input.x=x/l; input.z=z/l; input.sprint=!!(keys.ShiftLeft||keys.ShiftRight); }
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return; keys[e.code]=true; keyInput();
  if(e.code==='Space') pressB(); if(e.code==='KeyE'||e.code==='KeyK') pressA(); if(e.code==='KeyQ') { if(human&&state==='play') switchPlayer(true); }
  if(e.code==='Escape'||e.code==='KeyP') togglePause();
  if((state==='intro'||state==='replay') && (e.code==='Space'||e.code==='Enter')) skipCutscene();
});
addEventListener('keyup',e=>{ keys[e.code]=false; keyInput(); if(e.code==='Space') releaseB(); });
const joy={ id:null }, jz=$('joyZone'), jb=$('joyBase'), jk=$('joyKnob');
function joyMove(e){ const r=jb.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, R=r.width*0.36; let dx=e.clientX-cx, dy=e.clientY-cy; const d=Math.hypot(dx,dy); if(d>R){ dx*=R/d; dy*=R/d; } jk.style.transform=`translate(${dx}px,${dy}px)`; const m=Math.hypot(dx,dy); if(m<R*0.12){ input.x=0; input.z=0; } else { input.x=dx/R; input.z=dy/R; } }
jz.addEventListener('pointerdown',e=>{ if(joy.id!==null) return; e.preventDefault(); joy.id=e.pointerId; jb.classList.add('active'); joyMove(e); try{ jz.setPointerCapture(e.pointerId); }catch(_){} });
jz.addEventListener('pointermove',e=>{ if(e.pointerId===joy.id) joyMove(e); });
const joyEnd=e=>{ if(e.pointerId!==joy.id) return; joy.id=null; jb.classList.remove('active'); jk.style.transform='translate(0,0)'; input.x=0; input.z=0; keyInput(); };
jz.addEventListener('pointerup',joyEnd); jz.addEventListener('pointercancel',joyEnd);
function bindBtn(el,down,up){ el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.classList.add('down'); down(); }); const u=()=>{ if(!el.classList.contains('down')) return; el.classList.remove('down'); up&&up(); }; el.addEventListener('pointerup',u); el.addEventListener('pointercancel',u); el.addEventListener('pointerleave',u); }
bindBtn($('bA'),pressA); bindBtn($('bB'),pressB,releaseB);
canvas.addEventListener('pointerdown',()=>{ if(state==='intro'||state==='replay') skipCutscene(); });
function skipCutscene(){ if(state==='intro'){ finishIntro(); } else if(state==='replay'){ endReplay(); } }
function endReplay(){ replay=null; $('replayTag').style.display='none'; celebTeam=-1; state='play'; stateT=0; startRestart('kickoff',1-lastGoal.team); }
function togglePause(){ if(!human || !['play','goal','replay','intro','half'].includes(state)) return; paused=!paused; $('pausePanel').classList.toggle('hidden',!paused); }
$('pauseBtn').addEventListener('click',togglePause); $('resumeBtn').addEventListener('click',togglePause); $('quitBtn').addEventListener('click',toMenu);
$('startBtn').addEventListener('click',startGame); $('againBtn').addEventListener('click',startGame); $('menuBtn').addEventListener('click',toMenu);
$('soundBtn').addEventListener('click',()=>{ SND.init(); SND.mute(!SND.muted); $('soundBtn').textContent='Ton: '+(SND.muted?'aus':'an'); });
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{ if(document.hidden && human && state==='play' && !paused) togglePause(); });

function buildMenu(){
  $('opps').innerHTML = OPPS.map((o,i)=>`<button class="opp" data-i="${i}" aria-pressed="${i===oppIdx}"><i style="background:#${new THREE.Color(o.shirt).getHexString()}"></i><span>${o.name}<small>${['leicht','mittel','stark'][o.stars-1]}</small></span></button>`).join('');
  $('levels').innerHTML = Object.entries(LEVELS).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${k===levelKey}">${l.label}</button>`).join('');
  $('soundBtn').textContent='Ton: '+(SND.muted?'aus':'an');
  $('help').innerHTML = isTouch ? 'Joystick links: laufen (ganz aussen = Sprint) · <b>Pass</b> · <b>Schuss</b> gedrückt halten = mehr Kraft · ohne Ball: <b>Grätsche</b> und <b>Wechsel</b>'
    : '<kbd>WASD</kbd> laufen · <kbd>Shift</kbd> Sprint · <kbd>E</kbd> Pass / Grätsche · <kbd>Leertaste</kbd> halten = Schuss, ohne Ball = Wechsel · <kbd>P</kbd> Pause';
}
$('opps').addEventListener('click',e=>{ const b=e.target.closest('[data-i]'); if(!b) return; oppIdx=+b.dataset.i; store.set('opp',oppIdx); buildMenu(); startDemo(); });
$('levels').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(!b) return; levelKey=b.dataset.k; store.set('level',levelKey); level=LEVELS[levelKey]; buildMenu(); });

/* =========================================================== Loop */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); composer.setSize(w,h); bloom.setSize(w/2,h/2); camera.aspect=w/h; camera.fov=camera.aspect<1?58:40; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);
let last=performance.now(), acc=0, frameN=0, elapsed=0, fpsT=0, fpsN=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now; frameN++; elapsed+=dt;
  if(!paused){
    if(state==='intro'){ stateT+=dt; for(const e of ents){ e.cel = (stateT%1.4)<0.7?1:0; e.vel.set(0,0,0); pose(e); } ballMesh.position.copy(ball.pos); if(stateT>4.6) finishIntro(); }
    else if(state==='replay'){ stateT+=dt; replay.f+=dt*60*0.55; if(replay.f>=replay.end) endReplay(); else applyFrame(Math.floor(replay.f)); }
    else { acc+=dt; let n=0; while(acc>=STEP && n<6){ simulate(STEP); acc-=STEP; n++; } if(n===6) acc=0; for(const e of ents) animate(e,dt); ballMesh.position.copy(ball.pos); }
  }
  updateCamera(dt); updateMarkers(elapsed); updateCrowd(elapsed); updateConfetti(dt); updateFireworks(dt); updateNets(dt); updateTrail();
  for(const t of adTextures) t.offset.x=(t.offset.x+dt*0.04)%1;
  SND.update(dt, state==='play'?excite:0.2);
  if(frameN%3===0) drawRadar();
  updateHud();
  $('radar').style.display = (state==='play'||state==='goal') && human ? 'block':'none';
  $('score').style.display = human ? 'flex':'none';
  // automatische Qualität
  fpsT+=dt; fpsN++; if(fpsT>3){ const fps=fpsN/fpsT; if(fps<38 && useBloom){ useBloom=false; } fpsT=0; fpsN=0; }
  if(useBloom) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function init(){
  buildSky(); buildLandscape(); buildLights(); buildPitch(); buildGoal(-1); buildGoal(1); buildAdBoards();
  ['N','S','W','E'].forEach(buildStand); buildCrowd(); buildScreen(); buildFloodlights(); buildBall(); buildTrail(); buildConfetti(); buildMarkers();
  buildMenu(); resize(); startDemo(); requestAnimationFrame(frame);
  window.__fk={ get state(){return state;}, get score(){return score.slice();}, stat, sim(sec){ const n=Math.round(sec/STEP); for(let i=0;i<n;i++){ simulate(STEP); if(state==='replay') endReplay(); if(state==='intro') finishIntro(); } return { score:score.slice(), stat:{...stat}, state }; }, startGame, pressA, pressB, releaseB, input, get ctrl(){return ctrl&&ctrl.name;}, finishIntro, get bot(){ return ctrl?{ has:ball.owner===ctrl, x:ctrl.pos.x, z:ctrl.pos.z, bx:ball.pos.x, bz:ball.pos.z, restart:!!restart, oppHas:teamHas(1), clock }:null; } };
}
const fontsReady=document.fonts?document.fonts.load('800 40px "Barlow Condensed"'):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1500))]).then(init,init);
}
</script>
