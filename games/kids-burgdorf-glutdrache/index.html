<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Burgdorf – Die Nacht des Glutdrachen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffcf6b; --ink:#3a2615; --parch:#f4e7c6; --red:#e2483b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b1226; font-family:'Nunito',system-ui,sans-serif; color:#fff; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#game { display:block; }
  #hud { position:fixed; left:14px; top:12px; pointer-events:none; text-shadow:0 2px 4px #000a; z-index:5; max-width:min(70vw,520px); }
  #hearts { font-size:26px; letter-spacing:2px; color:var(--red); }
  #hearts .off { color:#ffffff30; }
  #lights { font-size:22px; margin-top:2px; color:var(--gold); letter-spacing:3px; }
  #lights .off { color:#ffffff30; }
  #objective { margin-top:8px; font-weight:700; font-size:15px; background:#0b1226b0; padding:7px 11px; border-radius:10px; border:1px solid #ffcf6b55; line-height:1.35; }
  #minimap { position:fixed; right:12px; top:12px; width:170px; height:170px; border-radius:50%; border:3px solid #ffcf6b99; box-shadow:0 4px 16px #0008; z-index:5; background:#0b1226; }
  #topbtns { position:fixed; right:14px; top:192px; display:flex; gap:8px; z-index:6; }
  .rbtn { width:38px; height:38px; border-radius:50%; border:2px solid #ffcf6b88; background:#0b1226c0; color:var(--gold); font:800 17px 'Nunito'; cursor:pointer; }
  #toast { position:fixed; left:50%; top:22%; transform:translateX(-50%); font:800 26px 'Cinzel',serif; color:var(--gold); text-shadow:0 3px 10px #000; opacity:0; transition:opacity .4s; pointer-events:none; text-align:center; z-index:6; }
  #progress { position:fixed; left:50%; bottom:22%; transform:translateX(-50%); width:240px; height:18px; border-radius:9px; background:#0008; border:2px solid var(--gold); display:none; z-index:6; overflow:hidden; }
  #progress div { height:100%; width:0; background:linear-gradient(90deg,#ff7a1a,#ffd36b); }
  #hint { position:fixed; left:50%; bottom:calc(22% + 26px); transform:translateX(-50%); font-weight:800; color:#fff; text-shadow:0 2px 6px #000; display:none; z-index:6; white-space:nowrap; }
  #flash { position:fixed; inset:0; background:radial-gradient(circle, transparent 40%, #ff1e0088 100%); opacity:0; pointer-events:none; transition:opacity .25s; z-index:4; }
  /* Story cards */
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#050a18aa; z-index:20; padding:16px; }
  #overlay.hidden { display:none; }
  .card { background:var(--parch); color:var(--ink); max-width:560px; width:100%; border-radius:14px; padding:26px 28px 22px; box-shadow:0 12px 50px #000c, inset 0 0 0 3px #c9a96a, inset 0 0 40px #c9a96a66; position:relative; max-height:92vh; overflow:auto; }
  .card h1 { font:800 30px/1.1 'Cinzel',serif; margin:0 0 4px; color:#7a1d14; }
  .card h2 { font:800 22px/1.2 'Cinzel',serif; margin:0 0 10px; color:#7a1d14; }
  .card .sub { font:600 14px 'Cinzel',serif; color:#8a6a3a; margin-bottom:14px; letter-spacing:1px; }
  .card p { font-size:17px; line-height:1.5; margin:0 0 12px; }
  .card .speaker { font-weight:800; color:#7a4a14; font-size:14px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .card .controls { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:15px; background:#e8d7ae; padding:10px 14px; border-radius:8px; margin:6px 0 14px; }
  .card kbd { background:#3a2615; color:var(--parch); border-radius:4px; padding:1px 7px; font:700 13px 'Nunito'; }
  .card .stats { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 14px; }
  .card .stats div { background:#e8d7ae; border-radius:8px; padding:6px 12px; font-weight:800; }
  .card button { font:800 18px 'Cinzel',serif; background:#7a1d14; color:var(--parch); border:none; border-radius:10px; padding:11px 26px; cursor:pointer; box-shadow:0 4px 0 #4a0f08; float:right; }
  .card button:active { transform:translateY(2px); box-shadow:0 2px 0 #4a0f08; }
  .card::after { content:''; display:block; clear:both; }
  .seal { position:absolute; right:22px; top:-22px; width:52px; height:52px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#e0574a,#8e1c12); box-shadow:0 3px 8px #0008; display:flex; align-items:center; justify-content:center; font:800 22px 'Cinzel'; color:#ffd9a0; }
  /* Touch */
  #touch { display:none; }
  body.touch #touch { display:block; }
  #joy { position:fixed; width:120px; height:120px; border-radius:50%; border:2px solid #ffffff55; background:#ffffff14; display:none; z-index:7; pointer-events:none; }
  #joy div { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:#ffcf6bcc; }
  .tbtn { position:fixed; border-radius:50%; border:3px solid #ffcf6baa; background:#0b1226b0; color:var(--gold); font:800 14px 'Nunito'; z-index:7; display:flex; align-items:center; justify-content:center; text-align:center; }
  #btnJump { right:20px; bottom:26px; width:76px; height:76px; }
  #btnAct { right:108px; bottom:62px; width:86px; height:86px; font-size:15px; }
  #joyHint { position:fixed; left:20px; bottom:20px; color:#ffffff70; font-weight:700; font-size:13px; z-index:6; pointer-events:none; }
  @media (max-width:640px){ #minimap{width:120px;height:120px} #topbtns{top:140px} #hearts{font-size:21px} #lights{font-size:18px} #objective{font-size:13px} .card{padding:20px} .card h1{font-size:24px} .card p{font-size:15px} }
</style>
</head>
<body>
<div id="hud">
  <div id="hearts"></div>
  <div id="lights"></div>
  <div id="objective"></div>
</div>
<canvas id="minimap" width="340" height="340"></canvas>
<div id="topbtns"><button class="rbtn" id="btnMusic" title="Musik an/aus (M)">♪</button><button class="rbtn" id="btnHelp" title="Hilfe (H)">?</button></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="progress"><div></div></div>
<div id="flash"></div>
<div id="touch">
  <div id="joy"><div></div></div>
  <div id="joyHint">◀ links wischen: laufen · rechts wischen: schauen ▶</div>
  <div class="tbtn" id="btnAct">✦<br>Licht</div>
  <div class="tbtn" id="btnJump">Sprung</div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// =====================================================================
//  BURGDORF – Die Nacht des Glutdrachen
// =====================================================================
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
let seed = 7; function srand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// ---------------------------------------------------------------- terrain
function riverX(z) { return 88 + 7 * Math.sin(z / 35) + 4 * Math.sin(z / 13 + 1); }
const CASTLE = { x: -48, z: 0, y: 15 };
function hRaw(x, z) {
  let h = 0.6 + 0.8 * Math.sin(x * 0.031 + 0.5) * Math.cos(z * 0.027);
  // Oberstadt plateau
  const dxo = Math.max(-40 - x, 0, x - 58), dzo = Math.max(Math.abs(z) - 13, 0);
  h = Math.max(h, 9 * (1 - smoothstep(0, 12, Math.hypot(dxo, dzo))));
  // Schlossfelsen
  const dC = Math.hypot(x - CASTLE.x, z - CASTLE.z);
  h = Math.max(h, 15 * (1 - smoothstep(22, 27, dC)));
  // Rampe Oberstadt -> Schloss
  if (x > -28 && x < -10) {
    const t = clamp((x + 27) / 15, 0, 1);
    const rh = 15 - 6 * t;
    const side = 1 - smoothstep(3.5, 6, Math.abs(z));
    h = Math.max(h, 9 + (rh - 9) * side);
  }
  // Gysnauflüe
  const dw = Math.max(100 - x, 0);
  const dot = Math.hypot(Math.max(x - 140, 0), Math.max(-100 - z, z + 40, 0));
  h = Math.max(h, 20 * (1 - smoothstep(0, 3.5, dw)) * (1 - smoothstep(0, 28, dot)));
  // Hügel am Rand
  const r = Math.max(Math.abs(x), Math.abs(z));
  h += 38 * smoothstep(150, 205, r) * (0.8 + 0.2 * Math.sin(x * 0.05 + z * 0.04));
  // Emme
  const rd = Math.abs(x - riverX(z));
  const c = 1 - smoothstep(6, 11, rd);
  h = h * (1 - c) + (-2.2) * c;
  return h;
}
const BZ = 40, BRX = riverX(40), BL = 28, BW = 6, BRIDGE_Y = 1.35;
function onBridge(x, z) { return Math.abs(x - BRX) < BL / 2 && Math.abs(z - BZ) < BW / 2; }
function groundAt(x, z) { let h = hRaw(x, z); if (onBridge(x, z)) h = Math.max(h, BRIDGE_Y); return h; }
const WATER_Y = -0.9;

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.id = 'game';
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15223f);
scene.fog = new THREE.FogExp2(0x1a2848, 0.0058);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1200);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x2a3a22, 0.95));
scene.add(new THREE.AmbientLight(0x404a70, 0.35));
const moon = new THREE.DirectionalLight(0xd2ddff, 0.75);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 1, far: 260 });
moon.shadow.bias = -0.0008;
scene.add(moon, moon.target);

// glow texture
const GLOW = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, 'rgba(255,255,255,0.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();
function glowSprite(color, size, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity }));
  s.scale.set(size, size, 1); return s;
}
const matCache = {};
function lam(c) { return matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c })); }
function box(w, h, d, c) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(c)); m.castShadow = true; m.receiveShadow = true; return m; }
function gableRoof(width, length, height, c) {
  const s = new THREE.Shape(); s.moveTo(-width / 2, 0); s.lineTo(width / 2, 0); s.lineTo(0, height); s.lineTo(-width / 2, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: length, bevelEnabled: false }); g.translate(0, 0, -length / 2);
  const m = new THREE.Mesh(g, lam(c)); m.castShadow = true; m.receiveShadow = true; return m;
}
const colliders = [];
function addCol(cx, cz, w, d, top = 999, cam = true) { colliders.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2, top, cam }); }

// sky: stars + moon
{
  const n = 1600, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(rand(0.05, 1));
    p[i * 3] = 700 * Math.sin(ph) * Math.cos(th); p[i * 3 + 1] = 700 * Math.cos(ph); p[i * 3 + 2] = 700 * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false }));
  scene.add(stars);
  const m = new THREE.Mesh(new THREE.SphereGeometry(18, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff6dd, fog: false }));
  m.position.set(320, 300, -420); scene.add(m);
  const mg = glowSprite(0xbfd0ff, 160, 0.5); mg.material.fog = false; mg.position.copy(m.position); scene.add(mg);
}

// terrain mesh
{
  const TS = 420, SEG = 230;
  const g = new THREE.PlaneGeometry(TS, TS, SEG, SEG); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, cols = new Float32Array(pos.count * 3);
  const cGrass = new THREE.Color(0x3d6b35), cGrass2 = new THREE.Color(0x2f5a2e), cStreet = new THREE.Color(0x615b52),
    cSand = new THREE.Color(0xc39a62), cBed = new THREE.Color(0x5f5843), cGravel = new THREE.Color(0x7a705f), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = hRaw(x, z);
    pos.setY(i, h);
    const sx = (hRaw(x + 1, z) - hRaw(x - 1, z)) / 2, sz = (hRaw(x, z + 1) - hRaw(x, z - 1)) / 2, slope = Math.hypot(sx, sz);
    tmp.copy(cGrass).lerp(cGrass2, 0.5 + 0.5 * Math.sin(x * 0.21) * Math.cos(z * 0.17));
    if (h > 8.5 && x > -30 && x < 58 && Math.abs(z) < 6.5) tmp.copy(cStreet);
    if (x > -27 && x < -10 && Math.abs(z) < 4 && h > 9) tmp.copy(cStreet);
    if (Math.hypot(x - CASTLE.x, z) < 21 && h > 14) tmp.copy(cGravel);
    if (slope > 0.85) tmp.lerp(cSand, smoothstep(0.85, 1.6, slope));
    if (h < -0.4) tmp.copy(cBed);
    cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  const t = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
  t.receiveShadow = true; scene.add(t);
}
// water
const water = new THREE.Mesh(new THREE.PlaneGeometry(420, 420, 1, 1), new THREE.MeshPhongMaterial({ color: 0x2f6fa0, transparent: true, opacity: 0.82, shininess: 90, specular: 0x88aaff }));
water.rotation.x = -Math.PI / 2; water.position.y = WATER_Y; scene.add(water);

// ---------------------------------------------------------------- town
const winLit = [], winDark = [], doors = [];
const _q = new THREE.Quaternion(), _s = new V3(1, 1, 1), _e = new THREE.Euler();
function addWindow(arr, x, y, z, rotY, sx = 1, sy = 1) {
  const m = new THREE.Matrix4(); _q.setFromEuler(_e.set(0, rotY, 0)); m.compose(new V3(x, y, z), _q, new V3(sx, sy, 1)); arr.push(m);
}
const WALLS = [0xeadfc8, 0xdcc9a4, 0xf1e8d6, 0xcfb68e, 0xe6d4b6, 0xc4ae8e, 0xdcd2c0];
const ROOFS = [0x8e3b2c, 0x7a3326, 0x9c4a33, 0x6b3a2a, 0x84402e];
function house(cx, cz, w, d, h, face, opts = {}) {
  const xs = [cx - w / 2, cx + w / 2], zs = [cz - d / 2, cz + d / 2];
  let base = 1e9; for (const x of xs) for (const z of zs) base = Math.min(base, groundAt(x, z));
  base = Math.min(base, groundAt(cx, cz));
  const wallC = opts.wall ?? WALLS[Math.floor(srand() * WALLS.length)];
  const roofC = opts.roof ?? ROOFS[Math.floor(srand() * ROOFS.length)];
  const b = box(w, h + 3, d, wallC); b.position.set(cx, base + h / 2 - 1.5, cz); scene.add(b);
  const rf = gableRoof(d + 0.9, w + 0.5, opts.roofH ?? (2.6 + srand() * 1.8), roofC); rf.rotation.y = Math.PI / 2; rf.position.set(cx, base + h, cz); scene.add(rf);
  const fz = cz + face * (d / 2 + 0.03), rot = face > 0 ? 0 : Math.PI;
  const floors = Math.max(1, Math.floor((h - 1) / 3)), ncol = Math.max(1, Math.floor(w / 2.3));
  for (let f = 0; f < floors; f++) for (let c = 0; c < ncol; c++) {
    const x = cx - w / 2 + (c + 0.5) * (w / ncol), y = base + 1.9 + f * 3;
    if (f === 0 && c === Math.floor(ncol / 2) && !opts.noDoor) { addWindow(doors, x, base + 1.1, fz, rot, 1.2, 2.2); continue; }
    addWindow(srand() < 0.55 ? winLit : winDark, x, y, fz, rot);
  }
  addCol(cx, cz, w, d, base + h + 2);
  return base;
}
// Oberstadt
for (const side of [-1, 1]) {
  let x = -10;
  while (x < 30) {
    const w = 5 + srand() * 3;
    if (!(x + w > 4 && x < 9) && !(x + w > 19 && x < 23)) house(x + w / 2, side * 9.6, w, 7, 7 + srand() * 4, -side);
    x += w + 0.15;
  }
}
// Unterstadt + Südquartier
function row(z, x0, x1, face, skip) {
  let x = x0;
  while (x < x1) {
    const w = 5 + srand() * 4;
    if (!skip || !skip(x, x + w)) house(x + w / 2, z, w, 7, 6 + srand() * 3, face);
    x += w + 1.5 + srand() * 3;
  }
}
row(34, -22, 60, -1, (a, b) => (b > 6 && a < 25));
row(78, -12, 62, -1, null);
row(-36, -12, 58, 1, null);
row(-52, -2, 50, -1, null);
// Kornhaus
{
  const base = house(15, 62, 24, 13, 10, -1, { wall: 0xe2cfa6, roof: 0x7a3326, roofH: 8, noDoor: true });
  const d = box(4, 4.2, 0.3, 0x3a2615); d.position.set(15, base + 2.1, 55.4); scene.add(d);
  const c = document.createElement('canvas'); c.width = 512; c.height = 96; const g = c.getContext('2d');
  g.fillStyle = '#5a3a1e'; g.fillRect(0, 0, 512, 96); g.fillStyle = '#ffdc9a'; g.font = 'bold 64px Georgia'; g.textAlign = 'center'; g.fillText('KORNHAUS', 256, 72);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(7, 1.3), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) }));
  sign.position.set(15, base + 5.6, 55.4); sign.rotation.y = Math.PI; scene.add(sign);
}
// Stadtkirche
{
  const base = groundAt(50, 0);
  const nave = box(16, 13, 10, 0xd8c7a3); nave.position.set(50, base + 4, 0); scene.add(nave);
  const r = gableRoof(10.8, 16.6, 5.5, 0x6b3a2a); r.rotation.y = Math.PI / 2; r.position.set(50, base + 10.5, 0); scene.add(r);
  const tw = box(5, 25, 5, 0xcdb88f); tw.position.set(40.5, base + 9.5, 0); scene.add(tw);
  const sp = new THREE.Mesh(new THREE.ConeGeometry(3.8, 11, 4), lam(0x4f6b5e)); sp.rotation.y = Math.PI / 4; sp.position.set(40.5, base + 27.5, 0); sp.castShadow = true; scene.add(sp);
  const clock = new THREE.Mesh(new THREE.CircleGeometry(1.2, 24), new THREE.MeshBasicMaterial({ color: 0xfff0c0 })); clock.rotation.y = -Math.PI / 2; clock.position.set(37.97, base + 17, 0); scene.add(clock);
  for (const zz of [-2.5, 2.5]) for (const xx of [45, 50, 55]) addWindow(winLit, xx, base + 5, zz * 2.02, zz > 0 ? 0 : Math.PI, 1.1, 2.6);
  addCol(50, 0, 16, 10); addCol(40.5, 0, 5, 5);
}
// Strassenlaternen + Solätte-Girlanden in der Oberstadt
const lampSpots = [];
for (let x = -6; x <= 30; x += 12) for (const z of [-5.6, 5.6]) {
  const b = groundAt(x, z);
  const p = box(0.22, 3.4, 0.22, 0x222222); p.position.set(x, b + 1.7, z); scene.add(p);
  const s = glowSprite(0xffc46b, 2.6, 0.9); s.position.set(x, b + 3.5, z); scene.add(s);
  lampSpots.push(s);
}
{
  const bulbs = [];
  const palette = [0xff4d4d, 0xffffff, 0xffd34d, 0x4dd2ff, 0x6bff8f, 0xff7ad9];
  for (const gx of [-4, 2.5, 13.5, 26]) {
    const y0 = groundAt(gx, 0) + 6.2;
    for (let i = 0; i <= 14; i++) {
      const t = i / 14, z = -6.4 + 12.8 * t, y = y0 - 1.6 * Math.sin(Math.PI * t);
      bulbs.push([gx, y, z, palette[i % palette.length]]);
    }
  }
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.16, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }), bulbs.length);
  const m = new THREE.Matrix4(), col = new THREE.Color();
  bulbs.forEach((b, i) => { m.makeTranslation(b[0], b[1], b[2]); im.setMatrixAt(i, m); im.setColorAt(i, col.setHex(b[3])); });
  scene.add(im);
}

// ---------------------------------------------------------------- castle
const STONE = 0x9a9384, STONE2 = 0x8b8475;
const merlons = [];
function wallSeg(x0, z0, x1, z1) {
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, len = Math.hypot(x1 - x0, z1 - z0), alongX = Math.abs(x1 - x0) > Math.abs(z1 - z0);

const PARTS = [];
for (let i = 0; i < 520; i++) { const s = glowSprite(0xffffff, 1, 1); s.visible = false; scene.add(s); PARTS.push({ s, life: 0, max: 1, vel: new V3(), grav: 0, size: 1, grow: 0 }); }
let pIdx = 0;
function emit(pos, vel, color, size, life, grav = 0, grow = 0) {
  const p = PARTS[pIdx = (pIdx + 1) % PARTS.length];
  p.s.position.copy(pos); p.vel.copy(vel); p.s.material.color.setHex(color); p.size = size; p.life = p.max = life; p.grav = grav; p.grow = grow; p.s.visible = true;
}
function burst(pos, color, n, speed, size, life, grav = 0) {
  for (let i = 0; i < n; i++) {
    const v = new V3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(speed * rand(0.4, 1));
    emit(pos, v, color, size * rand(0.6, 1.2), life * rand(0.6, 1.1), grav);
  }
}
function updateParticles(dt) {
  for (const p of PARTS) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.s.visible = false; continue; }
    p.vel.y += p.grav * dt; p.s.position.addScaledVector(p.vel, dt);
    const k = p.life / p.max; p.s.material.opacity = k; const sc = p.size * (1 + p.grow * (1 - k)); p.s.scale.set(sc, sc, 1);
  }
}

function updateDragon(dt, t) {

function updateFireballs(dt) {
