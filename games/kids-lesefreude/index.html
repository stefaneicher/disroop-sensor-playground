<style>
/* Layout: full-screen 3D night fair, HUD floats at the edges, reading happens on paper sheets that slide over the world */
:root{

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}

button{font:inherit;cursor:pointer;border:0;border-radius:12px}

a{color:#1d4ed8;font-weight:700}

select{font:inherit;font-size:16px;padding:6px 8px;border-radius:8px}

.btn.ic{display:inline-flex;align-items:center;gap:8px}.btn.ic svg{width:22px;height:22px;flex:none}

#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--bulb);z-index:40;background:var(--night)}

/* ---------------- Silbenhilfe ---------------- */
function syllables(word) {
  const lw = word.toLowerCase(), units = []; let i = 0;
  const isV = c => 'aeiouäöüy'.includes(c);
  while (i < lw.length) {
    const t3 = lw.slice(i, i + 3), t2 = lw.slice(i, i + 2);
    if (t3 === 'sch') { units.push(['C', 3]); i += 3; continue; }
    if (['ch', 'ck', 'ph', 'qu'].includes(t2)) { units.push(['C', 2]); i += 2; continue; }
    if (['ei', 'ie', 'au', 'eu', 'äu', 'ai', 'aa', 'ee', 'oo'].includes(t2)) { units.push(['V', 2]); i += 2; continue; }
    units.push([isV(lw[i]) ? 'V' : 'C', 1]); i++;
  }
  const nuc = units.map((u, k) => u[0] === 'V' ? k : -1).filter(k => k >= 0);
  const cuts = new Set();
  for (let n = 0; n < nuc.length - 1; n++) {
    const a = nuc[n], b = nuc[n + 1], between = b - a - 1;
    cuts.add(between === 0 ? b : between === 1 ? a + 1 : b - 1);
  }
  const out = []; let pos = 0, cur = '';
  units.forEach((u, k) => { if (cuts.has(k) && cur) { out.push(cur); cur = ''; } cur += word.slice(pos, pos + u[1]); pos += u[1]; });
  if (cur) out.push(cur);
  return out;
}
function readable(text, opts = {}) {
  const p = document.createElement('p'); p.className = 'read' + (S.settings.syl ? ' syl' : '');
  text.split(/\s+/).forEach((tok, i, arr) => {
    const m = tok.match(/^([^A-Za-zÄÖÜäöüß]*)([A-Za-zÄÖÜäöüß-]+)(.*)$/);
    const span = document.createElement('span'); span.className = 'w';
    if (m) {
      span.append(m[1]);
      syllables(m[2]).forEach((s, k) => { const e = document.createElement('span'); e.className = 's' + (k % 2); e.textContent = s; span.append(e); });
      span.append(m[3]);
      span.addEventListener('click', () => { speak(m[2]); span.classList.add('help'); S.stats.help[m[2]] = (S.stats.help[m[2]] || 0) + 1; save(); });
    } else span.textContent = tok;
    p.append(span); if (i < arr.length - 1) p.append(' ');
  });
  S.stats.words += text.split(/\s+/).length; save();
  return p;
}

    STANDS.forEach(s => { const u = s.obj.userData; if (u.tick) u.tick(t); if (u.flag) u.flag.rotation.y = Math.sin(t * 3) * .3; if (u.bob) u.bob.position.y = 5.3 + Math.sin(t * 2) * .15; });
    letterMeshes.forEach(m => { m.rotation.z = t * 2; m.position.y = 1.1 + Math.sin(t * 2 + m.userData.i) * .15; }); };
}
function buildSnow() {
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fd0f5'); scene.fog = new THREE.Fog('#d6ebfa', 40, 110);
  scene.add(new THREE.HemisphereLight('#ffffff', '#9bb4cc', 1));
  const sun = new THREE.DirectionalLight('#fff4dd', .8); sun.position.set(20, 30, 15); scene.add(sun);
  const snowT = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#f2f7fd'; g.fillRect(0, 0, w, h); for (let i = 0; i < 400; i++) { g.fillStyle = Math.random() < .5 ? '#e3edf8' : '#ffffff'; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 0, 7); g.fill(); } });
  snowT.wrapS = snowT.wrapT = THREE.RepeatWrapping; snowT.repeat.set(20, 20);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), M('#fff', { map: snowT })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const path = new THREE.Mesh(new THREE.RingGeometry(9, 12, 48), M('#dbe6f2')); path.rotation.x = -Math.PI / 2; path.position.y = .01; scene.add(path);
  for (let i = 0; i < 11; i++) { const a = Math.PI * .1 + i / 10 * Math.PI * .8; const r = 60 + Math.random() * 15, hgt = 26 + Math.random() * 20, rad = 16 + Math.random() * 8;
    const mt = new THREE.Mesh(new THREE.ConeGeometry(rad, hgt, 7), M('#7d8aa3', { flatShading: true })); mt.position.set(Math.cos(a + Math.PI) * r * -1, hgt / 2 - 1, -Math.abs(Math.sin(a)) * r); scene.add(mt);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(rad * .42, hgt * .42, 7), M('#ffffff', { flatShading: true })); cap.position.set(mt.position.x, hgt - hgt * .21 - 1, mt.position.z); scene.add(cap); }
  for (let i = 0; i < 40; i++) { const a = Math.random() * Math.PI * 2, r = FAIR_R + 3 + Math.random() * 14; const tr = pine(true); tr.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); tr.scale.setScalar(.8 + Math.random() * .6); scene.add(tr); }
  [[6, 6], [-5, -6], [22, 9], [-22, 10]].forEach(([x, z]) => { const s = snowman(1); s.position.set(x, 0, z); s.rotation.y = Math.atan2(-x, -z); scene.add(s); });
  addStands(scene, SNOW, false);
  const N = 900, fp = new Float32Array(N * 3); for (let i = 0; i < N; i++) { fp[i * 3] = (Math.random() - .5) * 70; fp[i * 3 + 1] = Math.random() * 25; fp[i * 3 + 2] = (Math.random() - .5) * 70; }
  const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.BufferAttribute(fp, 3)); const flakes = new THREE.Points(fg, new THREE.PointsMaterial({ color: '#ffffff', size: .18 })); scene.add(flakes);
  const sign2 = sign('Peters Snow-Safari', '#1d4ed8', 8.6); sign2.position.set(0, 7.4, -26); scene.add(sign2);
  [-4, 4].forEach(x => { const p = new THREE.Mesh(new THREE.CylinderGeometry(.25, .25, 7), M('#1d4ed8')); p.position.set(x, 3.5, -26); scene.add(p); });
  WORLDS.snow.scene = scene;
  let last = 0;
  WORLDS.snow.animate = t => { const dt = Math.min(.05, t - last); last = t; const a = fg.attributes.position;
    for (let i = 0; i < N; i++) { let y = a.array[i * 3 + 1] - dt * 2.2; if (y < 0) y += 25; a.array[i * 3 + 1] = y; a.array[i * 3] += Math.sin(t + i) * dt * .3; }
    a.needsUpdate = true;
    SNOW.forEach(s => { const u = s.obj.userData; if (u.tick) u.tick(t); });
    crystalMeshes.forEach(m => { m.rotation.z = t * 2; m.position.y = 1.1 + Math.sin(t * 2 + m.userData.i) * .15; }); };
}

function goWorld(id, first) {
  S.world = id; save(); const sc = W().scene;
  sc.add(player); sc.add(ball);
  if (!first) { player.position.set(13, 0, 19); player.rotation.y = Math.PI * .8; ball.position.set(13, .22, 18.4); camera.position.set(13, 9, 30); toast(id === 'snow' ? 'Willkommen auf der Snow-Safari!' : 'Zurück auf der Chilbi!'); }
  player.userData.beanie.visible = id === 'snow'; player.userData.hair.visible = id !== 'snow';
  nearStand = null; $('#near').hidden = true; renderHUD();
}

function build() {
  const cv = $('#world');
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.outputEncoding = THREE.sRGBEncoding;
  camera = new THREE.PerspectiveCamera(55, 1, .1, 250);
  player = makePeter(); player.position.set(0, 0, 20); player.rotation.y = Math.PI;
  ball = makeBall(); ball.position.set(0, .22, 19.4);
  buildChilbi(); buildSnow();
  camera.position.set(0, 9, 31);
  goWorld(S.world, true);
  respawnLetters(); respawnCrystals();
  clock = new THREE.Clock();
  resize(); addEventListener('resize', resize);
  renderer.setAnimationLoop(tick);
  $('#loading').remove();
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 68 : 55; camera.updateProjectionMatrix(); }

let walkT = 0, nearStand = null, yaw = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime, w = W();
  if (modalOpen) return;
  let ix = joy.x, iz = joy.y;
  if (keys.has('arrowleft') || keys.has('a')) ix -= 1; if (keys.has('arrowright') || keys.has('d')) ix += 1;
  if (keys.has('arrowup') || keys.has('w')) iz -= 1; if (keys.has('arrowdown') || keys.has('s')) iz += 1;
  if (keys.has('q')) yaw += dt * 2.2; if (keys.has('e')) yaw -= dt * 2.2;
  const len = Math.hypot(ix, iz);
  if (!modalOpen && len > .08) {
    const sp = 6.5 * Math.min(1, len); ix /= Math.max(1, len); iz /= Math.max(1, len);
    { const cy = Math.cos(yaw), sy = Math.sin(yaw), wx = ix * cy + iz * sy, wz = -ix * sy + iz * cy; ix = wx; iz = wz; }
    player.position.x += ix * sp * dt; player.position.z += iz * sp * dt;
    const target = Math.atan2(ix, iz); let d = target - player.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); player.rotation.y += d * Math.min(1, dt * 12);
    walkT += dt * 10;
  } else walkT *= .9;
  w.stands.forEach(s => { const dx = player.position.x - s.pos[0], dz = player.position.z - s.pos[1], d = Math.hypot(dx, dz) || .01, min = s.r + .5; if (d < min) { player.position.x = s.pos[0] + dx / d * min; player.position.z = s.pos[1] + dz / d * min; } });
  const pd = Math.hypot(player.position.x, player.position.z); if (pd > FAIR_R) { player.position.x *= FAIR_R / pd; player.position.z *= FAIR_R / pd; }
  const u = player.userData, sw = Math.sin(walkT) * .6 * Math.min(1, len + .001);
  u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw; u.armR.rotation.x = sw; player.position.y = Math.abs(Math.sin(walkT)) * .06;
  const fx = player.position.x + Math.sin(player.rotation.y) * .6, fz = player.position.z + Math.cos(player.rotation.y) * .6;
  const bdx = fx - ball.position.x, bdz = fz - ball.position.z; ball.position.x += bdx * Math.min(1, dt * 8); ball.position.z += bdz * Math.min(1, dt * 8);
  ball.rotation.x += bdz * dt * 20; ball.rotation.z -= bdx * dt * 20;
  const want = player.position.clone().add(new THREE.Vector3(Math.sin(yaw) * 11, 8.5, Math.cos(yaw) * 11)); camera.position.lerp(want, Math.min(1, dt * 6)); camera.lookAt(player.position.x, 1.2, player.position.z);
  w.animate(t);
  if (!modalOpen) {
    const list = S.world === 'snow' ? crystalMeshes : letterMeshes;
    for (const m of list) if (Math.hypot(m.position.x - player.position.x, m.position.z - player.position.z) < 1.2) { S.world === 'snow' ? collectCrystal(m) : collect(m); break; }
  }
  let best = null, bd = 99; w.stands.forEach(s => { const d = Math.hypot(player.position.x - s.pos[0], player.position.z - s.pos[1]) - s.r; if (d < 2.4 && d < bd) { bd = d; best = s; } });
  if (best !== nearStand) { nearStand = best; const n = $('#near'); if (best) { $('#nearName').textContent = best.name; $('#nearSub').textContent = best.sub; n.hidden = false; } else n.hidden = true; }
  renderer.render(w.scene, camera);
}
function enterStand() { if (!nearStand || modalOpen) return; const s = nearStand; openModal(s.name, s.sub, b => s.open(b), s.reading !== false); }
$('#nearBtn').onclick = enterStand;


/* Eingabe */
addEventListener('keydown', e => { if (modalOpen) { if (e.key === 'Escape') closeModal(); return; } const k = e.key.toLowerCase(); if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', 'q', 'e'].includes(k)) { keys.add(k); e.preventDefault(); } if (k === 'enter') enterStand(); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
(() => { const st = $('#stick'), kn = $('#knob'); let id = null; const R = 45;
  const set = e => { const r = st.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; } kn.style.transform = `translate(${dx}px,${dy}px)`; joy.x = dx / R; joy.y = dy / R; };
  st.addEventListener('pointerdown', e => { id = e.pointerId; st.setPointerCapture(id); set(e); });
  st.addEventListener('pointermove', e => { if (e.pointerId === id) set(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; joy.x = joy.y = 0; kn.style.transform = ''; };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end); })();

(() => { const cv = $('#world'); let pid = null, lx = 0;
  cv.addEventListener('pointerdown', e => { if (pid !== null || modalOpen) return; pid = e.pointerId; lx = e.clientX; try { cv.setPointerCapture(pid); } catch (_) {} });
  cv.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; yaw -= (e.clientX - lx) * .009; lx = e.clientX; const th = $('#turnHint'); if (th) th.style.opacity = 0; });
  const end = e => { if (e.pointerId === pid) pid = null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  setTimeout(() => { const th = $('#turnHint'); if (th) th.style.opacity = 0; }, 9000); })();

/* Start */
const fontsReady = Promise.race([Promise.all([document.fonts.load('40px Bungee'), document.fonts.load('20px "Andika"')]), new Promise(r => setTimeout(r, 1800))]);
fontsReady.catch(() => {}).then(() => { try { build(); renderHUD(); } catch (err) { $('#loading').textContent = 'Die 3D-Ansicht konnte nicht starten.'; console.error(err); } });
try { speechSynthesis.getVoices(); } catch (e) {}
})();
</script>
